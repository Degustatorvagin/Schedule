<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Расписание НЧИ КФУ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0e1621;
            --surface: #17212b;
            --border: #242f3d;
            --primary: #2481cc;
            --text: #ffffff;
            --text-muted: #7f91a4;
            --accent-green: #22c55e;
            --orange: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding: 12px; min-height: 100vh; display: flex; flex-direction: column; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
        .target-info { display: flex; flex-direction: column; cursor: pointer; }
        .target-title { font-size: 18px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 6px; }
        .target-change-badge { font-size: 11px; background: rgba(36, 129, 204, 0.2); color: #40a7e3; padding: 2px 6px; border-radius: 6px; }
        .target-sub { font-size: 12px; color: var(--text-muted); max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .week-pill { background: rgba(36, 129, 204, 0.15); border: 1px solid rgba(36, 129, 204, 0.4); color: #40a7e3; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }

        .day-switcher { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px 8px; margin-bottom: 12px; }
        .arrow-btn { background: none; border: none; color: #40a7e3; font-size: 18px; padding: 8px 14px; cursor: pointer; font-weight: 700; border-radius: 8px; }
        .arrow-btn:active { background: rgba(255,255,255,0.05); }
        .current-day-label { font-size: 15px; font-weight: 700; text-align: center; }
        .current-date-label { font-size: 11px; color: var(--text-muted); text-align: center; }

        .days-scroll { display: flex; gap: 5px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 2px; }
        .day-tab { flex: 1; min-width: 42px; text-align: center; padding: 8px 0; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; }
        .day-tab.active { background: var(--primary); color: #fff; border-color: transparent; }

        .lesson-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .lesson-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
        .lesson-time { font-size: 14px; font-weight: 700; color: #40a7e3; }
        .lesson-type { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }
        .type-lek { background: rgba(36, 129, 204, 0.2); color: #60a5fa; }
        .type-pr { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .type-lab { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
        .lesson-title { font-size: 15px; font-weight: 600; line-height: 1.35; color: #fff; }
        .lesson-place { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
        .lesson-meta-badge { font-size: 13px; color: #cbd5e1; font-weight: 500; }

        .break-card { text-align: center; padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 600; margin-bottom: 10px; }
        .break-lunch { background: rgba(245, 158, 11, 0.12); border: 1px dashed rgba(245, 158, 11, 0.4); color: #fbbf24; }
        .break-window { background: rgba(239, 68, 68, 0.12); border: 1px dashed rgba(239, 68, 68, 0.4); color: #f87171; }
        .break-short { background: rgba(127, 145, 164, 0.08); color: var(--text-muted); font-weight: 500; }
        .empty-day { text-align: center; padding: 40px 10px; color: var(--text-muted); font-size: 15px; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; align-items: flex-end; z-index: 100; }
        .modal-sheet { background: var(--surface); width: 100%; max-height: 85vh; border-radius: 20px 20px 0 0; border-top: 1px solid var(--border); padding: 18px 14px; display: flex; flex-direction: column; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .modal-title { font-size: 17px; font-weight: 700; }
        .modal-close { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }
        
        .modal-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .modal-tab-btn { flex: 1; padding: 9px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text-muted); font-weight: 600; font-size: 13px; cursor: pointer; text-align: center; }
        .modal-tab-btn.active { background: var(--primary); color: #fff; border-color: transparent; }

        .search-input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: #fff; padding: 12px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 12px; outline: none; }
        .search-input:focus { border-color: var(--primary); }
        .items-list { overflow-y: auto; max-height: 50vh; display: flex; flex-direction: column; gap: 6px; }
        .item-card { background: var(--bg); border: 1px solid var(--border); padding: 10px 14px; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .item-card:active { background: rgba(36, 129, 204, 0.2); }
        .item-title { font-weight: 700; color: #fff; font-size: 15px; }
        .item-sub { font-size: 12px; color: var(--text-muted); max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="target-info" onclick="openModal()">
            <div class="target-title">
                <span id="display-target">Загрузка...</span>
                <span class="target-change-badge">🔍 Сменить</span>
            </div>
            <div class="target-sub" id="display-sub">НЧИ КФУ</div>
        </div>
        <button class="week-pill" id="btn-week-toggle" onclick="toggleWeek()">Нижняя неделя 🔽</button>
    </div>

    <div class="day-switcher">
        <button class="arrow-btn" onclick="shiftDay(-1)">◀</button>
        <div>
            <div class="current-day-label" id="label-day">Понедельник</div>
            <div class="current-date-label" id="label-date">...</div>
        </div>
        <button class="arrow-btn" onclick="shiftDay(1)">▶</button>
    </div>

    <div class="days-scroll" id="days-tabs"></div>
    <div id="lessons-list"></div>

    <div class="modal-overlay" id="selection-modal" onclick="closeModal(event)">
        <div class="modal-sheet" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title">Выбор расписания</div>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-tabs">
                <button class="modal-tab-btn active" id="tab-btn-groups" onclick="switchModalTab('groups')">👥 Группы (156)</button>
                <button class="modal-tab-btn" id="tab-btn-teachers" onclick="switchModalTab('teachers')">👨‍🏫 Преподаватели (286)</button>
            </div>
            <input type="text" class="search-input" id="search-input" placeholder="Поиск по номеру или фамилии..." oninput="filterModalItems()">
            <div class="items-list" id="modal-items-list"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const BELLS = {
            "08:00": "09:30", "09:40": "11:10", "11:50": "13:20", "13:30": "15:00", "15:40": "17:10", "17:20": "18:50", "19:00": "20:30",
            "08:30": "10:00", "10:20": "11:50", "12:30": "14:00", "14:20": "15:50", "16:00": "17:30", "17:40": "19:10", "19:20": "20:50"
        };
        const DAYS = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
        const SHORT_DAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];

        let DB = {};
        let ALL_TEACHERS = [];
        let curRole = 'student'; // 'student' или 'teacher'
        let curTarget = '7241452';
        let curWN = 'н';
        let curDayIdx = new Date().getDay() === 0 ? 0 : new Date().getDay() - 1;
        let activeTab = 'groups';

        async function initApp() {
            const params = new URLSearchParams(window.location.search);
            const roleParam = params.get('role');
            const teacherParam = params.get('teacher');
            const groupParam = params.get('group');

            if (roleParam === 'teacher' || teacherParam) {
                curRole = 'teacher';
                curTarget = teacherParam || localStorage.getItem('kfu_target_teacher') || 'Мельников А.Е.';
            } else if (groupParam) {
                curRole = 'student';
                curTarget = groupParam;
            } else {
                curRole = localStorage.getItem('kfu_role') || 'student';
                curTarget = (curRole === 'teacher')
                    ? (localStorage.getItem('kfu_target_teacher') || 'Мельников А.Е.')
                    : (localStorage.getItem('kfu_target_group') || '7241452');
            }

            // Запрос актуальной роли с сервера Bothost при открытии через меню
            if (!roleParam && !teacherParam && !groupParam && tg?.initDataUnsafe?.user?.id) {
                try {
                    const apiRes = await fetch(`https://bot-1791299850-3323-degustatorvagin.bothost.tech/api/user_info?user_id=${tg.initDataUnsafe.user.id}`);
                    if (apiRes.ok) {
                        const info = await apiRes.json();
                        if (info.target) {
                            curRole = info.role || 'student';
                            curTarget = info.target;
                            saveCurrentTarget();
                        }
                    }
                } catch (e) {
                    console.log('Bothost offline, using local storage');
                }
            }

            try {
                const res = await fetch('./schedule.json');
                if (res.ok) {
                    DB = await res.json();
                    extractTeachers();
                }
            } catch (e) {
                console.warn('schedule.json load error', e);
            }

            saveCurrentTarget();
            renderTabs();
            renderSchedule();
        }

        function saveCurrentTarget() {
            localStorage.setItem('kfu_role', curRole);
            if (curRole === 'teacher') {
                localStorage.setItem('kfu_target_teacher', curTarget);
            } else {
                localStorage.setItem('kfu_target_group', curTarget);
            }
        }

        function extractTeachers() {
            const tSet = new Set();
            for (let grp in DB) {
                const sched = DB[grp].schedule || {};
                for (let wn of ['в', 'н']) {
                    for (let day in (sched[wn] || {})) {
                        for (let l of sched[wn][day]) {
                            const raw = (l.teacher || '').trim();
                            if (raw && raw !== '—') {
                                const parts = raw.split(/\s{2,}|\n|,/);
                                parts.forEach(p => {
                                    const clean = p.trim();
                                    if (clean.length > 3 && !/^\d+$/.test(clean)) tSet.add(clean);
                                });
                            }
                        }
                    }
                }
            }
            ALL_TEACHERS = Array.from(tSet).sort();
        }

        function getTeacherLessons(teacherName, wn, dayName) {
            const list = [];
            const tClean = teacherName.toLowerCase().trim();
            for (let grp in DB) {
                const gLessons = (DB[grp].schedule && DB[grp].schedule[wn] && DB[grp].schedule[wn][dayName]) ? DB[grp].schedule[wn][dayName] : [];
                for (let l of gLessons) {
                    if ((l.teacher || '').toLowerCase().includes(tClean)) {
                        list.push({ ...l, group: grp });
                    }
                }
            }
            list.sort((a, b) => a.time.localeCompare(b.time));
            
            const merged = [];
            list.forEach(l => {
                const exist = merged.find(m => m.time === l.time && m.subject === l.subject && m.room === l.room);
                if (exist) {
                    if (!exist.group.includes(l.group)) exist.group += `, ${l.group}`;
                } else {
                    merged.push({ ...l });
                }
            });
            return merged;
        }

        function renderTabs() {
            const container = document.getElementById('days-tabs');
            container.innerHTML = '';
            SHORT_DAYS.forEach((name, idx) => {
                const btn = document.createElement('div');
                btn.className = 'day-tab' + (idx === curDayIdx ? ' active' : '');
                btn.innerText = name;
                btn.onclick = () => {
                    curDayIdx = idx;
                    renderTabs();
                    renderSchedule();
                };
                container.appendChild(btn);
            });
        }

        function toggleWeek() {
            curWN = curWN === 'в' ? 'н' : 'в';
            document.getElementById('btn-week-toggle').innerText = curWN === 'в' ? 'Верхняя неделя 🔼' : 'Нижняя неделя 🔽';
            renderSchedule();
        }

        function shiftDay(step) {
            curDayIdx = (curDayIdx + step + 6) % 6;
            renderTabs();
            renderSchedule();
        }

        function parseMins(tStr) {
            const [h, m] = tStr.split(':').map(Number);
            return h * 60 + m;
        }

        function renderSchedule() {
            const dayName = DAYS[curDayIdx];
            document.getElementById('label-day').innerText = dayName;

            if (curRole === 'teacher') {
                document.
