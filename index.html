    <style>
        :root {
            --bg: #0e1621;
            --surface: #17212b;
            --border: #242f3d;
            --primary: #2481cc;
            --accent-green: #22c55e;
            --text: #ffffff;
            --text-muted: #7f91a4;
            --orange: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding: 14px; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Шапка с группой и неделей */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .group-title { font-size: 19px; font-weight: 700; color: #fff; }
        .group-sub { font-size: 13px; color: var(--text-muted); }
        .week-pill { background: rgba(36, 129, 204, 0.15); border: 1px solid rgba(36, 129, 204, 0.4); color: #40a7e3; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; }

        /* Переключатель дней (Стрелочки + дата) */
        .day-switcher { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 6px 10px; margin-bottom: 14px; }
        .arrow-btn { background: none; border: none; color: #40a7e3; font-size: 18px; padding: 8px 14px; cursor: pointer; font-weight: 700; border-radius: 8px; }
        .arrow-btn:active { background: rgba(255,255,255,0.05); }
        .current-day-label { font-size: 15px; font-weight: 700; text-align: center; }
        .current-date-label { font-size: 12px; color: var(--text-muted); text-align: center; font-weight: 500; }

        /* Табы дней недели Пн - Сб */
        .days-scroll { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 4px; }
        .day-tab { flex: 1; min-width: 44px; text-align: center; padding: 9px 0; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; }
        .day-tab.active { background: var(--primary); color: #fff; border-color: transparent; }

        /* Карточка пары */
        .lesson-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
        .lesson-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
        .lesson-time { font-size: 14px; font-weight: 700; color: #40a7e3; }
        .lesson-type { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; text-transform: uppercase; background: rgba(255,255,255,0.06); color: var(--text-muted); }
        .type-lek { background: rgba(36, 129, 204, 0.2); color: #60a5fa; }
        .type-pr { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .lesson-title { font-size: 15px; font-weight: 600; line-height: 1.3; }
        .lesson-place { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
        .lesson-teacher { font-size: 13px; color: var(--text-muted); }

        /* Плашки окон и обедов */
        .break-card { text-align: center; padding: 9px; border-radius: 10px; font-size: 13px; font-weight: 600; margin-bottom: 10px; }
        .break-lunch { background: rgba(245, 158, 11, 0.1); border: 1px dashed rgba(245, 158, 11, 0.4); color: #fbbf24; }
        .break-window { background: rgba(239, 68, 68, 0.1); border: 1px dashed rgba(239, 68, 68, 0.4); color: #f87171; }
        .break-short { background: rgba(127, 145, 164, 0.08); color: var(--text-muted); font-size: 12px; font-weight: 500; }

        .empty-day { text-align: center; padding: 40px 10px; color: var(--text-muted); font-size: 15px; font-weight: 500; }
    </style>
</head>

            curDayIdx = (curDayIdx + step + 6) % 6;
            renderTabs();
            renderSchedule();
        }

            const [h, m] = tStr.split(':').map(Number);
            return h * 60 + m;
        }

            document.getElementById('display-group').innerText = curGroup;

                    const prevEndT = BELLS[dayLessons[i-1].time.substring(0, 5)];

                        const diff = parseMins(startT) - parseMins(prevEndT);

                        const m = diff % 60;
                        const tText = (h > 0 ? `${h} ч ` : '') + (m > 0 ? `${m} мин` : '');

                        if ((prevEndT === '11:50' && startT === '12:30') || (prevEndT === '11:10' && startT === '11:50')) {
                            list.innerHTML += `<div class="break-card break-lunch">🥪 Обед ${tText} (${prevEndT} – ${startT})</div>`;

                            list.innerHTML += `<div class="break-card break-window">🕳 Окно ${tText} (${prevEndT} – ${startT})</div>`;
                        } else if (diff > 0) {
                            list.innerHTML += `<div class="break-card break-short">☕ Перерыв ${tText} (${prevEndT} – ${startT})</div>`;
                        }
                    }
                }

                const typeClass = (l.type.toLowerCase().includes('лек')) ? 'type-lek' : 'type-pr';
                const card = document.createElement('div');
                card.className = 'lesson-card';
                card.innerHTML = `
                    <div class="lesson-header">
                        <span class="lesson-time">⏰ ${startT}${endT ? ' – ' + endT : ''}</span>
                        <span class="lesson-type ${typeClass}">${l.type || 'пара'}</span>
                    </div>
                    <div class="lesson-title">${l.subject}</div>
                    <div class="lesson-place">📍 ${l.building} ${l.room ? ', ауд. ' + l.room : ''}</div>
                    <div class="lesson-teacher">👤 ${l.teacher || 'Преподаватель'}</div>
                `;
                list.appendChild(card);
            });
        }

        renderTabs();
        renderSchedule();
