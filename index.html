function build() {
  T = {};
  for (const g in DATA) {
    const s = DATA[g].schedule || {};
    for (const w in s) {
      for (const d in s[w]) {
        for (const l of s[w][d]) {
          const n = (l.teacher || '').trim();
          if (!n || n === '—') continue;
          ((T[n] ??= {})[w] ??= {})[d] ??= [];
          T[n][w][d].push({ ...l, group: g });
        }
      }
    }
  }
}

function getWeek(d) {
  return manualWeek || wcode(d);
}

function lessonsOf(t, w, d) {
  if (!t) return [];
  if (t.k === 'g') {
    return (DATA[t.n]?.schedule?.[w]?.[d] || []).map(l => ({ ...l }));
  }
  const m = {};
  for (const l of (T[t.n]?.[w]?.[d] || [])) {

    if (m[k]) {
      if (!m[k].group.includes(l.group)) m[k].group += ', ' + l.group;
    } else {
      m[k] = { ...l };
    }
  }
  return Object.values(m).sort((a, b) => a.time.localeCompare(b.time));
}

const span = l => {
  const st = l.time.slice(0, 5);
  const b = BELLS[st];
  return [mins(st), b ? mins(b[0]) : mins(st) + 90];
};

const cls = t => /лек/i.test(t) ? 'lec' : /лаб/i.test(t) ? 'lab' : /пр|сем/i.test(t) ? 'pra' : 'oth';

function status(t, now) {
  const gi = now.getDay();
  const nm = now.getHours() * 60 + now.getMinutes();
  const L = gi ? lessonsOf(t, getWeek(now), DN[gi - 1]) : [];
  let live = null, next = null;
  for (const l of L) {
    const [s, e] = span(l);
    if (nm >= s && nm < e) live = { l, s, e };
    else if (s > nm && !next) next = { l, s, e };
  }
  return { live, next, L, nm };
}

const where = l => 'ауд. ' + esc(l.room) + (l.building ? ', ' + esc(l.building) : '');

function stLine(t, now) {
  const s = status(t, now);
  if (s.live) return `Сейчас: ${where(s.live.l)}`;

}

const wkPill = d => `<button class="pill g" data-a="toggle_week" title="Переключить неделю"><i></i>${getWeek(d) === 'в' ? 'Верхняя неделя 🔼' : 'Нижняя неделя 🔽'}</button>`;

function home() {
  const now = NOW();
  const s = status(me.target, now);
  const isFinished = !s.live && !s.next && s.L.length > 0;
  const isWeekend = now.getDay() === 0 || s.L.length === 0;

  let h = `
    <div class="top">
      <div class="who">
        <h1>Привет${me.nick ? ', ' + esc(me.nick) : ''}</h1>
        <small>${esc(me.target.n)} · ${now.getDate()} ${MO[now.getMonth()]}</small>
      </div>
      <div style="flex-shrink:0;">
        ${wkPill(now)}
      </div>
    </div>`;

  if (s.live) {
    const l = s.live.l;
    const durM = s.live.e - s.live.s;
    const el = s.nm - s.live.s;
    const pct = Math.max(0, Math.min(100, Math.round(el / durM * 100)));
    h += `
      <div class="box hero">
        <div class="mu">Идёт прямо сейчас · до звонка ${s.live.e - s.nm} мин</div>
        <h3>${esc(l.subject)}</h3>
        <div>${where(l)} ${l.group ? '· ' + esc(l.group) : ''}</div>
        <div class="bar"><i></i></div>
      </div>`;
    setTimeout(() => {
      const b = document.querySelector('.hero .bar i');
      if (b) b.style.width = pct + '%';
    }, 20);
  } else if (s.next) {
    const l = s.next.l;
    h += `
      <div class="box hero">
        <div class="mu">Следующая пара через ${s.next.s - s.nm} мин</div>
        <h3>${esc(l.subject)}</h3>
        <div>${l.time.slice(0, 5)} · ${where(l)} ${l.group ? '· ' + esc(l.group) : ''}</div>
      </div>`;
  } else if (isFinished) {
    h += `
      <div class="box g">
        <b>🎉 Все пары на сегодня завершились!</b>
        <div class="mu" style="margin-top:4px">Можно отдыхать, домашку сделаешь завтра</div>
      </div>`;
  } else {
    h += `
      <div class="box hero">
        <div class="mu">Сегодня пар нет</div>
        <h3>Выходной день 🎉</h3>
        <div>Отдыхаем и набираемся сил</div>
      </div>`;
  }

  if (isFinished || isWeekend) {
    const tomorrow = new Date(now);
    tomorrow.setDate(tomorrow.getDate() + 1);
    h += `<h2>Расписание на завтра (${tomorrow.getDate()} ${MO[tomorrow.getMonth()]})</h2>`;
    h += dayHtml(me.target, tomorrow, false);
  } else {
    h += `<h2>Расписание на сегодня</h2>`;
    h += dayHtml(me.target, now, false);
  }

  if (me.fav && me.fav.length) {
    h += `<h2>Избранное</h2><div class="box g" style="padding:4px 16px">`;
    h += me.fav.map(f => item(f.k === 'g' ? 'users' : 'user', f.n, stLine(f, now), 'who', key(f))).join('');
    h += `</div>`;
  }

  $('page').innerHTML = h;
}

const dk = d => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
const nk = (d, l) => dk(d) + '|' + l.time.slice(0, 5) + '|' + l.subject;

function dayHtml(t, d, click) {
  const now = NOW();
  const w = getWeek(d);
  const gi = d.getDay();
  const L = gi === 0 ? [] : lessonsOf(t, w, DN[gi - 1]);
  const today = same(d, now);
  const nm = now.getHours() * 60 + now.getMinutes();

  if (!L.length) {
    return `<div class="empty"><b>В этот день пар нет</b>${gi === 0 ? 'Воскресенье — законный выходной' : 'Занятий по расписанию не запланировано'}</div>`;
  }

  const f = span(L[L.length - 1]);
  let h = `<div class="mu" style="margin:0 4px 12px">${L.length} ${L.length === 1 ? 'пара' : L.length < 5 ? 'пары' : 'пар'} · до ${hm(f[1])}</div>`;

  L.forEach((l, i) => {
    const [a, e] = span(l);
    if (i > 0) {
      const prev = span(L[i - 1]);
      const g = a - prev[1];
      if (g > 10) {
        const isLunch = (prev[1] === 11 * 60 + 50 && a === 12 * 60 + 30) || (prev[1] === 11 * 60 + 10 && a === 11 * 60 + 50);
        h += `<div class="gap">${isLunch ? '🥪 Обед 40 мин' : '🕳 Окно ' + dur(g)} (${hm(prev[1])} – ${hm(a)})</div>`;
      }
    }
    const no = `<div class="no"><b>${i + 1}</b><span>${l.time.slice(0, 5)}</span><span>${hm(e)}</span></div>`;
    const live = today && nm >= a && nm < e;
    const note = NOTES[nk(d, l)];
    const whoSub = t.k === 't' ? (l.group || '') : (l.teacher || '');

    h += `
      <div class="row${live ? ' live' : ''}">
        ${no}
        <div>
          <button class="card g ${cls(l.type)}" ${click ? `data-a="les" data-v="${i}"` : ''}>
            <div class="tp">${esc(l.type || 'Пара')}</div>
            <h3>${esc(l.subject)}</h3>
            <div class="meta">
              <span>${esc(whoSub)}</span>
              <span class="rm">${esc(l.room)}${l.building ? ', ' + esc(l.building) : ''}</span>
            </div>
            ${note ? `<div class="nt">📝 ${esc(note)}</div>` : ''}
          </button>
        </div>
      </div>`;
  });

  return h;
}

function sched() {
  const t = me.target;

  const gi = date.getDay();
  const sp = t.k === 'g' ? (DATA[t.n]?.spec || '') : 'Преподаватель кафедры';

  let h = `
    <div class="top">
      <div class="who">
        <h1>${esc(t.n)}</h1>
        <small>${esc(sp)}</small>

        ${wkPill(date)}
      </div>
    </div>

    <div class="day-nav-bar">
      <button class="day-nav-btn pill g" data-a="shift" data-v="-1">‹ Вчера</button>
      <b style="font-size:13px;color:var(--tx);font-weight:700;">${date.getDate()} ${MO[date.getMonth()]}</b>
      <button class="day-nav-btn pill g" data-a="shift" data-v="1">Завтра ›</button>
    </div>`;

  const m = mon(date);
  const w = getWeek(date);
  let s = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(m);
    d.setDate(m.getDate() + i);
    const has = i < 6 && lessonsOf(t, w, DN[i]).length;
    s += `
      <button class="d${has ? ' has' : ''}${same(d, now) ? ' now' : ''}${same(d, date) ? ' sel' : ''}" data-a="day" data-v="${i}">
        <span>${SH[i]}</span>
        <b>${d.getDate()}</b>
        <u></u>
      </button>`;
  }
  h += `<div class="strip g">${s}</div>`;

  CUR = gi === 0 ? [] : lessonsOf(t, w, DN[gi - 1]);
  h += `<div id="lst" class="slide">${dayHtml(t, date, true)}</div>`;
  $('page').innerHTML = h;

  $('today').hidden = same(date, now);

  let x0 = null;
  $('page').ontouchstart = e => x0 = e.touches[0].clientX;
  $('page').ontouchend = e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    x0 = null;
    if (Math.abs(dx) > 65) shiftDay(dx < 0 ? 1 : -1);
  };
}

function shiftDay(n) {
  date = new Date(date.getFullYear(), date.getMonth(), date.getDate() + n);
  const l = $('lst');
  if (l) {
    l.style.setProperty('--dx', (n > 0 ? 18 : -18) + 'px');
    l.classList.add('slide');

  sched();
}

    </div>

  `;

  $('ai_send').onclick = handleAiSend;
  $('ai_input').onkeydown = e => { if (e.key === 'Enter') handleAiSend(); };
}

async function runAiCompress() {
  const txt = $('lecture_text') ?$('lecture_text'].value.trim() : '';
  if (!txt) return toast('Вставьте текст лекции');

  const btn = $('btn_compress_ai');
  const resBox = $('ai_summary_result');
  const resContent = $('ai_summary_content');

  btn.disabled = true;
  btn.textContent = '🦉 Совёнок думает...';
  resBox.style.display = 'none';

  try {
    const res = await fetch(`${API_URL}/api/ai_compress`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: txt, task: aiMode })
    });
    const data = await res.json();
    if (data.status === 'ok') {
      resContent.innerHTML = esc(data.result).replace(/\n/g, '<br>');
      resBox.style.display = 'block';
      resBox.scrollIntoView({ behavior: 'smooth' });
      toast('Конспект готов!', '✓');
    } else {
      toast(data.message || 'Ошибка обработки');
    }
  } catch (e) {
    toast('Сервер недоступен');
  } finally {
    btn.disabled = false;
    btn.textContent = '🦉 Сократить через Совёнок AI';
  }
}

function copyAiResult() {
  const t = $('ai_summary_content').innerText;
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast('Скопировано', '✓'));
}

function postAiMsg(text, isMe = false) {
  const c = $('ai_chat');
  if (!c) return;
  const div = document.createElement('div');
  div.className = 'bub ' + (isMe ? 'me' : 'g');
  div.innerHTML = esc(text).replace(/\n/g, '<br>');
  c.appendChild(div);
  div.scrollIntoView({ behavior: 'smooth' });
}

function handleAiSend() {
  const inp = $('ai_input');
  const q = inp.value.trim();
  if (!q) return;
  postAiMsg(q, true);
  inp.value = '';
  setTimeout(() => processAiQuery(q), 280);
}

function processAiQuery(q) {
  const lower = q.toLowerCase();
  const now = NOW();

  if (lower.includes('обед') || lower.includes('кушать')) {
    postAiMsg('🥪 Обед проходит с 11:50 до 12:30 (в институте с 11:10 до 11:50). Успеешь перекусить!');
    return;
  }
  if (lower.includes('пар') || lower.includes('осталось')) {
    const gi = now.getDay();
    if (!gi) { postAiMsg('🎉 Сегодня воскресенье, пар нет!'); return; }
    const L = lessonsOf(me.target, getWeek(now), DN[gi - 1]);
    const nm = now.getHours() * 60 + now.getMinutes();
    const remaining = L.filter(l => span(l)[1] > nm);
    postAiMsg(remaining.length ? `📚 На сегодня осталось пар: ${remaining.length}` : '🎉 Все пары на сегодня уже завершились!');
    return;
  }
  if (lower.includes('отмаз')) {
    const exc = EXCUSES[Math.floor(Math.random() * EXCUSES.length)];
    postAiMsg(`🦉 Совёнок советует отмазку:\n\n«${exc}»`);
    return;
  }

  const allT = Object.keys(T);
  const matched = allT.filter(t => lower.includes(t.toLowerCase().split(' ')[0]));
  if (matched.length) {
    const targetT = matched[0];
    const s = status({ k: 't', n: targetT }, now);
    if (s.live) postAiMsg(`📍 ${targetT} веде́т пару: ${s.live.l.subject} (${where(s.live.l)})`);
    else postAiMsg(`ℹ️ У преподавателя ${targetT} сейчас пар нет.`);
    return;
  }

  postAiMsg('🦉 Совёнок AI на связи! Спроси про расписание, аудитории или отправь текст для сжатия.');
}

function picker(o) {
  P = o; pk = o.k;
  $('pnl').innerHTML = `<h1 style="font-size:22px">${o.title}</h1><input class="fld" id="q" placeholder="Поиск..." autocomplete="off"><div id="items"></div>`;
  $('sheet').classList.add('on'); items();
}

function items() {
  const n = s => s.toLowerCase().replace(/[^a-z0-9а-яё]/g, ''), q = n($('q').value);
  const ls = pk === 'g' ? Object.keys(DATA) : Object.keys(T).sort((a,b)=>a.localeCompare(b,'ru'));
  $('items').innerHTML = ls.filter(k=>!q||n(k).includes(q)||(pk==='g'&&n(DATA[k].spec||'').includes(q))).map(k=>item(pk==='g'?'users':'c',esc(k),pk==='g'?esc((DATA[k].spec||'').replace(/,\s*\d+\s*чел.*/,'')):'Преподаватель','pick',k)).join('')||'<div class="empty"><b>Ничего не найдено</b></div>';
}

const pickRole = (r, lock) => {
  if (r === 't') {
    const pin = prompt('Введите пин-код для преподавателей:');

  }
  picker({ k: r, lock, title: r==='g'?'Твоя группа':'Твоя фамилия', cb: t => { if (!me) me = { nick: tgU?tgU.first_name:'', org:'НЧИ КФУ', fav:[] }; me.role=r; me.target=t; sv('me', me); go('h'); } });
};

const closeS = () => $('sheet').classList.remove('on');

let authPollTimer = null;
function startTgAuth() {
  const authCode = Math.random().toString(36).substring(2, 8).toUpperCase();
  window.open(`https://t.me/${BOT}?start=auth_${authCode}`, '_blank');
  toast('Подтвердите вход в боте', '💬');

  clearInterval(authPollTimer);
  authPollTimer = setInterval(async () => {
    try {
      const res = await fetch(`${API_URL}/api/auth_poll?code=${authCode}`);
      if (!res.ok) return;
      const data = await res.json();
      if (data.status === 'confirmed') {
        clearInterval(authPollTimer);
        me.tgUser = { id: data.user_id, username: data.username, first_name: data.first_name };
        if (data.target && (DATA[data.target] || T[data.target])) {
          me.target = { k: 'g', n: data.target };
        }
        sv('me', me);
        toast(`Вход выполнен: ${data.first_name}`, '✓');
        go('a');
      }
    } catch (e) {}
  }, 2000);
}

const A = {
  tab: v => go(v),
  role: v => pickRole(v, true),
  close: () => { if (!(P && P.lock && !me)) closeS(); },
  day: v => { const m = mon(date); m.setDate(m.getDate() + +v); date = m; sched(); },
  today: () => { date = ds(NOW()); sched(); },
  shift: v => shiftDay(+v),
  toggle_week: () => { manualWeek = (getWeek(date) === 'в') ? 'н' : 'в'; toast(manualWeek === 'в' ? 'Верхняя неделя' : 'Нижняя неделя', manualWeek === 'в' ? '▲' : '▼'); go(); },
  set_ai_mode: v => { aiMode = v; ai(); },
  cal: () => { calM = new Date(date.getFullYear(), date.getMonth(), 1); calOpen(); },
  cm: v => { calM = new Date(calM.getFullYear(), calM.getMonth() + +v, 1); calOpen(); },
  cd: v => { date = new Date(calM.getFullYear(), calM.getMonth(), +v); closeS(); sched(); },
  les: v => lesOpen(+v),
  savenote: async v => {
    const val = $('note') ?$('note').value.trim() : '';
    if (val) NOTES[v] = val; else delete NOTES[v];
    sv('notes', NOTES);
    if (me.tgUser && me.tgUser.id) {
      try { await fetch(`${API_URL}/api/save_note`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_id: me.tgUser.id, note_key: v, note_text: val }) }); } catch(e){}
    }
    toast('Заметка сохранена', '✓'); closeS(); sched();
  },
  shn: v => {
    const t = NOTES[v] || ''; if (!t) return toast('Напишите заметку');
    if (navigator.share) navigator.share({ text: t }).catch(()=>{});
  },
  who: v => whoOpen(v),
  fav: () => { const k = key(PT); me.fav = me.fav.some(x => key(x) === k) ? me.fav.filter(x => key(x) !== k) : [...me.fav, PT]; sv('me', me); drawWho(); if (tab==='f') flist(); if (tab==='h') home(); },
  pd: v => { pDate = new Date(pDate.getFullYear(), pDate.getMonth(), pDate.getDate() + +v); drawWho(); },
  seg: v => { seg = v; find(); },
  chg: () => pickRole(me.role, false),
  favs: () => { seg = 'f'; go('f'); },
  edit: editOpen,
  save: () => { me.nick = $('nick').value.trim(); me.org = 'НЧИ КФУ'; sv('me', me); closeS(); prof(); },
  look: lookOpen,
  acc: v => { cfg.ac = +v; sv('cfg', cfg); look(); lookOpen(); },
  th: v => { cfg.theme = v; sv('cfg', cfg); look(); lookOpen(); },
  shr: () => { if (navigator.share) navigator.share({ title: 'Расписание НЧИ КФУ', url: location.href }).catch(()=>{}); },
  reset: () => { if (confirm('Сбросить настройки?')) { try{localStorage.clear();}catch(e){} me=null; cfg={theme:'auto',ac:0}; NOTES={}; look(); go(); } },
  ver: () => { if (++taps >= 5) { taps=0; const p=prompt('PIN:'); if(p===ADMIN_PIN) adminOpen(); } },
  ball: () => { const s = status(me.target, NOW()); postAiMsg(`🔮 Предсказание:\n«${s.L.length?BALL[Math.floor(Math.random()*BALL.length)]:'Пар нет'}»`); },
  ai_locate: () => { const q = prompt('Фамилия преподавателя:'); if(q) processAiQuery('где ' + q); },
  ai_lunch: () => processAiQuery('обед'),
  ai_left: () => processAiQuery('сколько пар'),
  ai_excuse: () => postAiMsg(`🎲 Отмазка:\n\n«${EXCUSES[Math.floor(Math.random()*EXCUSES.length)]}»`),
  x: () => {},
  pick: v => { closeS(); P.cb({ k: pk, n: v }); }
};

document.addEventListener('click', e => { const c = e.target.closest('[data-a]'); if (c && A[c.dataset.a]) A[c.dataset.a](c.dataset.v); });
document.addEventListener('input', e => { if (e.target.id === 'q') items(); if (e.target.id === 'fq') flist(); });

function initSheetGestures() {
  ['pnl', 'apnl'].forEach(id => {
    const p = $(id); if (!p) return;
    let sY = 0, cY = 0, drag = false;
    p.addEventListener('touchstart', e => { if (p.scrollTop <= 0) { sY = e.touches[0].clientY; cY = sY; drag = true; } else drag = false; }, { passive: true });
    p.addEventListener('touchmove', e => { if (!drag) return; const d = e.touches[0].clientY - sY; if (d > 0) { cY = e.touches[0].clientY; p.style.transform = `translateY(${d}px)`; p.style.transition = 'none'; } }, { passive: true });
    p.addEventListener('touchend', () => {
      if (!drag) return; drag = false; const d = cY - sY;
      p.style.transition = 'transform 0.22s cubic-bezier(0.16, 1, 0.3, 1)';
      if (d > 75) { p.style.transform = 'translateY(100%)'; setTimeout(() => { if(id==='pnl') closeS(); else $('adm').classList.remove('on'); p.style.transform=''; p.style.transition=''; }, 180); }
      else { p.style.transform = 'translateY(0)'; setTimeout(()=>{ p.style.transform=''; p.style.transition=''; }, 220); }
    });
  });
}

function adminOpen() {
  $('apnl').innerHTML = `<h1 style="font-size:22px;margin-bottom:12px">Dev Админка</h1><div class="box g"><b>Групп в базе:</b> ${Object.keys(DATA).length}</div>`;
  $('adm').classList.add('on'); $('ascrim').onclick = () =>$('adm').classList.remove('on');
}

function init() {
  build(); look(); initSheetGestures();
  const params = new URLSearchParams(window.location.search);
  const urlGrp = params.get('group'), urlTchr = params.get('teacher');
  if (urlGrp && DATA[urlGrp]) me = { nick: tgU?tgU.first_name:'', org:'НЧИ КФУ', role:'g', target:{k:'g', n:urlGrp}, fav:me?.fav||[] };
  else if (urlTchr && T[urlTchr]) me = { nick: tgU?tgU.first_name:'', org:'НЧИ КФУ', role:'t', target:{k:'t', n:urlTchr}, fav:me?.fav||[] };
  if (me && !(me.target.k==='g'?DATA[me.target.n]:T[me.target.n])) me = null;
  go();
}

fetch('./schedule.json').then(r => r.ok ? r.json() : null).then(j => { if (j && Object.keys(j).length) { DATA = j; build(); init(); } }).catch(() => init());
