function build() {
  T = {};
  for (const g in DATA) {
    const s = DATA[g].schedule || {};
    for (const w in s) {
      for (const d in s[w]) {
        for (const l of s[w][d]) {
          const n = (l.teacher || '').trim();
          if (!n || n === '—') continue;
          ((T[n] ??= {})[w] ??= {})[d] ??= [];
          T[n][w][d].push({ ...l, group: g });
        }
      }
    }

}

function getWeek(d) { return manualWeek || wcode(d); }

function lessonsOf(t, w, d) {
  if (!t) return [];
  if (t.k === 'g') return (DATA[t.n]?.schedule?.[w]?.[d] || []).map(l => ({ ...l }));
  const m = {};
  for (const l of (T[t.n]?.[w]?.[d] || [])) {

    if (m[k]) { if (!m[k].group.includes(l.group)) m[k].group += ', ' + l.group; }
    else m[k] = { ...l };
  }
  return Object.values(m).sort((a, b) => a.time.localeCompare(b.time));
}

const span = l => { const st = l.time.slice(0, 5), b = BELLS[st]; return [mins(st), b ? mins(b[0]) : mins(st) + 90]; };
const cls = t => /лек/i.test(t) ? 'lec' : /лаб/i.test(t) ? 'lab' : /пр|сем/i.test(t) ? 'pra' : 'oth';

function status(t, now) {
  const gi = now.getDay(), nm = now.getHours() * 60 + now.getMinutes();
  const L = gi ? lessonsOf(t, getWeek(now), DN[gi - 1]) : [];
  let live = null, next = null;
  for (const l of L) {
    const [s, e] = span(l);
    if (nm >= s && nm < e) live = { l, s, e };
    else if (s > nm && !next) next = { l, s, e };
  }
  return { live, next, L, nm };
}

const where = l => 'ауд. ' + esc(l.room) + (l.building ? ', ' + esc(l.building) : '');

function stLine(t, now) {
  const s = status(t, now);
  if (s.live) return `Сейчас: ${where(s.live.l)}`;

function home() {

  const s = status(me.target, now);

  } else if (s.next) {

    h += `<div class="box hero"><div class="mu">Следующая пара через ${s.next.s - s.nm} мин</div><h3>${esc(l.subject)}</h3><div>${l.time.slice(0, 5)} · ${where(l)}</div></div>`;
  } else if (isFinished) {
    h += `<div class="box g"><b>🎉 Все пары на сегодня завершились!</b><div class="mu" style="margin-top:4px">Можно отдыхать</div></div>`;
  } else {
    h += `<div class="box hero"><div class="mu">Сегодня пар нет</div><h3>Выходной день 🎉</h3><div>Отдыхаем и набираемся сил</div></div>`;

    h += `<h2>Расписание на сегодня</h2>`;

  }

const dk = d => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
const nk = (d, l) => dk(d) + '|' + l.time.slice(0, 5) + '|' + l.subject;

function dayHtml(t, d, click) {
  const now = NOW(), w = getWeek(d), gi = d.getDay();
  const L = gi === 0 ? [] : lessonsOf(t, w, DN[gi - 1]);
  const today = same(d, now), nm = now.getHours() * 60 + now.getMinutes();
  if (!L.length) return `<div class="empty"><b>В этот день пар нет</b>Занятий не запланировано</div>`;

  const f = span(L[L.length - 1]);
  let h = `<div class="mu" style="margin:0 4px 12px">${L.length} пар · до ${hm(f[1])}</div>`;

  L.forEach((l, i) => {
    const [a, e] = span(l);
    if (i > 0) {
      const prev = span(L[i - 1]), g = a - prev[1];
      if (g > 10) h += `<div class="gap">🕳 Окно ${dur(g)} (${hm(prev[1])} – ${hm(a)})</div>`;
    }
    const no = `<div class="no"><b>${i + 1}</b><span>${l.time.slice(0, 5)}</span><span>${hm(e)}</span></div>`;
    const live = today && nm >= a && nm < e, note = NOTES[nk(d, l)];
    h += `<div class="row${live ? ' live' : ''}">${no}<div><button class="card g ${cls(l.type)}" ${click ? `data-a="les" data-v="${i}"` : ''}><div class="tp">${esc(l.type || 'Пара')}</div><h3>${esc(l.subject)}</h3><div class="meta"><span>${esc(t.k === 't' ? (l.group || '') : (l.teacher || ''))}</span><span class="rm">${esc(l.room)}${l.building ? ', ' + esc(l.building) : ''}</span></div>${note ? `<div class="nt">📝 ${esc(note)}</div>` : ''}</button></div></div>`;
  });
  return h;
}

async function runAiCompress() {
  const txt = $('lecture_text') ?$('lecture_text').value.trim() : '';

  btn.disabled = true; btn.textContent = '🦉 Совёнок думает...'; resBox.style.display = 'none';
  try {
    const res = await fetch(`${API_URL}/api/ai_compress`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: txt, task: aiMode }) });
    const data = await res.json();
    if (data.status === 'ok') { resContent.innerHTML = esc(data.result).replace(/\n/g, '<br>'); resBox.style.display = 'block'; toast('Готово!', '✓'); }
    else toast(data.message || 'Ошибка');
  } catch (e) { toast('Сервер недоступен'); }
  finally { btn.disabled = false; btn.textContent = '🦉 Сократить через Совёнок AI'; }
}

        clearInterval(authPollTimer);
        me.tgUser = { id: data.user_id, username: data.username, first_name: data.first_name };
        if (data.target && DATA[data.target]) me.target = { k: 'g', n: data.target };
        sv('me', me); toast(`Вход: ${data.first_name}`, '✓'); go('a');
      }
    } catch(e){}
  }, 2000);
}

const A = {
  tab: v => go(v), role: v => pickRole(v, true), close: () => closeS(),
  day: v => { const m = mon(date); m.setDate(m.getDate() + +v); date = m; sched(); },
  today: () => { date = ds(NOW()); sched(); }, shift: v => shiftDay(+v),
  toggle_week: () => { manualWeek = (getWeek(date) === 'в') ? 'н' : 'в'; go(); },
  set_ai_mode: v => { aiMode = v; ai(); },
  cal: () => { calM = new Date(date.getFullYear(), date.getMonth(), 1); calOpen(); },
  cm: v => { calM = new Date(calM.getFullYear(), calM.getMonth()+ +v, 1); calOpen(); },
  cd: v => { date = new Date(calM.getFullYear(), calM.getMonth(), +v); closeS(); sched(); },
  les: v => lesOpen(+v),
  savenote: async v => { const val = $('note') ?$('note').value.trim() : ''; if(val) NOTES[v]=val; else delete NOTES[v]; sv('notes', NOTES); toast('Сохранено','✓'); closeS(); sched(); },
  who: v => whoOpen(v),
  fav: () => { const k = key(PT); me.fav = me.fav.some(x=>key(x)===k)?me.fav.filter(x=>key(x)!==k):[...me.fav,PT]; sv('me',me); drawWho(); },
  pd: v => { pDate = new Date(pDate.getFullYear(), pDate.getMonth(), pDate.getDate()+ +v); drawWho(); },
  seg: v => { seg = v; find(); }, chg: () => pickRole(me.role, false), favs: () => { seg='f'; go('f'); },
  edit: editOpen, save: () => { me.nick = $('nick').value.trim(); sv('me',me); closeS(); prof(); },
  look: lookOpen, acc: v => { cfg.ac=+v; sv('cfg',cfg); look(); lookOpen(); }, th: v => { cfg.theme=v; sv('cfg',cfg); look(); lookOpen(); },
  shr: () => { if(navigator.share) navigator.share({title:'Расписание',url:location.href}).catch(()=>{}); },
  reset: () => { if(confirm('Сбросить?')) { localStorage.clear(); me=null; go(); } },
  ver: () => { if(++taps>=5){taps=0; const p=prompt('PIN:'); if(p===ADMIN_PIN) adminOpen();} },
  x: () => {}, pick: v => { closeS(); P.cb({k:pk, n:v}); }
};

document.addEventListener('click', e => { const c = e.target.closest('[data-a]'); if (c && A[c.dataset.a]) A[c.dataset.a](c.dataset.v); });
document.addEventListener('input', e => { if (e.target.id === 'q') items(); if (e.target.id === 'fq') flist(); });

function initSheetGestures() {
  ['pnl', 'apnl'].forEach(id => {
    const p = $(id); if (!p) return;
    let sY = 0, cY = 0, drag = false;
    p.addEventListener('touchstart', e => { if (p.scrollTop <= 0) { sY = e.touches[0].clientY; cY = sY; drag = true; } else drag = false; }, { passive: true });
    p.addEventListener('touchmove', e => { if (!drag) return; const d = e.touches[0].clientY - sY; if (d > 0) { cY = e.touches[0].clientY; p.style.transform = `translateY(${d}px)`; } }, { passive: true });
    p.addEventListener('touchend', () => { if (!drag) return; drag = false; if (cY - sY > 75) closeS(); p.style.transform = ''; });
  });
}

function adminOpen() { $('apnl').innerHTML = `<h1 style="font-size:22px">Админка</h1><div class="box g">Групп: ${Object.keys(DATA).length}</div>`; $('adm').classList.add('on'); }

function init() {
  build(); look(); initSheetGestures();
  const params = new URLSearchParams(window.location.search);
  const urlGrp = params.get('group');
  if (urlGrp && DATA[urlGrp]) me = { nick: tgU?tgU.first_name:'', org:'НЧИ КФУ', role:'g', target:{k:'g', n:urlGrp}, fav:me?.fav||[] };
  if (!me) onboard(); else go();
}

fetch('./schedule.json').then(r => r.ok ? r.json() : null).then(j => { if (j && Object.keys(j).length) { DATA = j; build(); init(); } }).catch(() => init());
</script>
