<style>
:root {
  --bg: #EAF0F6;
  --gl: rgba(255,255,255,0.78);
  --gb: rgba(255,255,255,0.85);
  --ln: rgba(12,26,42,0.08);
  --tx: #0B1623;
  --mu: #5F7488;
  --ac: #0075FF;
  --on: #ffffff;
  --lec: #3F5FD6;
  --pra: #12906A;
  --lab: #D6426A;
  --free: #10B981;
  --b1: #A7D8F5;
  --b2: #BEEFE0;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #070F19;
    --gl: rgba(22,32,46,0.72);
    --gb: rgba(255,255,255,0.12);
    --ln: rgba(255,255,255,0.08);
    --tx: #EFF5FA;
    --mu: #8DA2B6;
    --ac: #2FD39B;
    --on: #032018;
    --lec: #7C9CFF;
    --pra: #4FD1A5;
    --lab: #FF8FA3;
    --free: #34D399;
    --b1: #0A2F4C;
    --b2: #073D32;
  }
}
:root[data-theme="dark"] {
  --bg: #070F19;
  --gl: rgba(22,32,46,0.72);
  --gb: rgba(255,255,255,0.12);
  --ln: rgba(255,255,255,0.08);
  --tx: #EFF5FA;
  --mu: #8DA2B6;
  --ac: #2FD39B;
  --on: #032018;
  --lec: #7C9CFF;
  --pra: #4FD1A5;
  --lab: #FF8FA3;
  --free: #34D399;
  --b1: #0A2F4C;
  --b2: #073D32;
}

* {
  box-sizing: border-box;
  margin: 0;
  font-family: Onest, system-ui, -apple-system, sans-serif;
  -webkit-tap-highlight-color: transparent;
  transition: background-color 0.25s ease, border-color 0.25s ease, color 0.2s ease;
}

html, body {
  height: 100%;
  color: var(--tx);
  background: radial-gradient(75% 45% at 0% 0%, var(--b1), transparent 70%),
              radial-gradient(65% 45% at 100% 30%, var(--b2), transparent 70%),
              var(--bg);
  background-attachment: fixed;
  scrollbar-width: none;
}
::-webkit-scrollbar { display: none; }

#app { height: 100%; display: flex; flex-direction: column; max-width: 520px; margin: 0 auto; }
#page { flex: 1; overflow-y: auto; padding: 0 16px 125px; scrollbar-width: none; }

/* Плавный вход экранов */
.view-enter {
  animation: pageSlide .28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes pageSlide {
  from { opacity: 0; transform: translateY(14px) scale(0.985); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

button {
  border: 0; background: none; color: inherit; cursor: pointer; font-size: inherit;
  transition: transform 0.14s ease, opacity 0.14s ease;
}
button:active { transform: scale(0.965); }

svg { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
h1 { font-size: 26px; font-weight: 800; letter-spacing: -.4px; }
h2 { font-size: 19px; font-weight: 800; margin: 20px 4px 10px; }
.mu { color: var(--mu); font-size: 13px; }

.g {
  background: var(--gl);
  border: 1px solid var(--gb);
  border-radius: 26px;
  -webkit-backdrop-filter: blur(24px) saturate(1.6);
  backdrop-filter: blur(24px) saturate(1.6);
  box-shadow: 0 10px 28px rgba(0,0,0,0.04);
}

.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 16px 4px 10px; }
.pill {
  font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 99px;
  white-space: nowrap; display: inline-flex; align-items: center; cursor: pointer;
}
.pill i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ac); margin-right: 7px; }
.ib { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; font-weight: 700; }
.box { padding: 16px 18px; margin-bottom: 12px; }

/* Фирменный баннер на главной */
.main-banner {
  display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 28px;
  background: linear-gradient(135deg, rgba(0,117,255,0.14), rgba(47,211,155,0.14));
  border: 1px solid rgba(255,255,255,0.3); margin-bottom: 14px; position: relative; overflow: hidden;
}
.main-banner .owl-badge {
  width: 58px; height: 58px; border-radius: 20px; background: var(--ac); color: var(--on);
  display: grid; place-items: center; flex: none; box-shadow: 0 8px 20px rgba(0,117,255,0.28);
}
.main-banner h3 { font-size: 18px; font-weight: 800; line-height: 1.25; }
.main-banner p { font-size: 12px; color: var(--mu); margin-top: 3px; font-weight: 500; }

.hero { background: var(--ac); color: var(--on); border: 0; padding: 22px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,117,255,0.25); }
.hero .mu { color: inherit; opacity: .82; }
.hero h3 { font-size: 23px; font-weight: 800; margin: 6px 0 10px; line-height: 1.25; }
.bar { height: 6px; border-radius: 6px; background: var(--ln); margin-top: 14px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ac); }
.hero .bar { background: rgba(0,0,0,.18); }
.hero .bar i { background: var(--on); }

.it { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 4px; border-bottom: 1px solid var(--ln); }
.it:last-child { border: 0; }
.it b { display: block; font-weight: 700; font-size: 15px; }
.it small { display: block; font-size: 13px; color: var(--mu); margin-top: 2px; }
.it .t { flex: 1; min-width: 0; }
.it .t small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ic { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--ac) 15%, transparent); color: var(--ac); flex: none; }
.chev { color: var(--mu); flex: none; font-size: 18px; }
.lab2 { font-size: 13px; font-weight: 700; color: var(--mu); margin: 20px 8px 8px; }
.btn { display: block; width: 100%; padding: 15px; border-radius: 20px; background: var(--ac); color: var(--on); font-weight: 800; text-align: center; text-decoration: none; margin-top: 10px; font-size: 15px; }
.btn.gl { background: var(--gl); color: var(--tx); border: 1px solid var(--gb); }
.fld { width: 100%; padding: 14px 16px; border-radius: 18px; border: 1px solid var(--gb); background: var(--gl); color: var(--tx); font-size: 15px; margin: 6px 0 10px; outline: 0; }
textarea.fld { min-height: 100px; resize: none; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; border-radius: 18px; margin: 8px 0; }
.seg button { padding: 10px 4px; border-radius: 14px; font-weight: 700; color: var(--mu); font-size: 13px; }
.seg .on { background: var(--ac); color: var(--on); }
.dots { display: flex; gap: 10px; overflow-x: auto; padding: 4px; scrollbar-width: none; }
.dot { width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; }

/* Настоящее iPhone-стекло для нижней навигации */
.tabbar {
  position: fixed; left: 16px; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  max-width: 488px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 7px; border-radius: 34px; z-index: 10;
  background: rgba(255, 255, 255, 0.72);
  -webkit-backdrop-filter: blur(28px) saturate(190%);
  backdrop-filter: blur(28px) saturate(190%);
  border: 1px solid rgba(255, 255, 255, 0.55);
  box-shadow: 0 14px 38px rgba(0, 0, 0, 0.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .tabbar {
    background: rgba(20, 28, 40, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 14px 38px rgba(0, 0, 0, 0.45);
  }
}
:root[data-theme="dark"] .tabbar {
  background: rgba(20, 28, 40, 0.75);
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 14px 38px rgba(0, 0, 0, 0.45);
}

.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--mu); padding: 8px 2px; border-radius: 22px; }
.tabbar .on { color: var(--ac); background: color-mix(in srgb, var(--ac) 12%, transparent); }

.day-nav-bar { display: flex; justify-content: space-between; align-items: center; padding: 4px 4px 10px; }
.day-nav-btn { font-size: 13px; font-weight: 700; padding: 7px 14px; border-radius: 99px; }

/* Полоска дней */
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 6px; margin-bottom: 14px; border-radius: 28px; }
.d { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 8px; border-radius: 22px; position: relative; }
.d span { font-size: 11px; color: var(--mu); font-weight: 600; }
.d b { font-size: 17px; font-weight: 800; }
.d u { width: 5px; height: 5px; border-radius: 50%; background: var(--ln); }
.d.has u { background: var(--mu); }
.d.now b { color: var(--ac); }
.d.sel { background: var(--ac); color: var(--on); box-shadow: 0 6px 16px color-mix(in srgb, var(--ac) 30%, transparent); }
.d.sel span, .d.sel b { color: var(--on); }
.d.sel u { background: var(--on); }
/* Подсветка выходного для преподавателя */
.d.teacher-free { background: color-mix(in srgb, var(--free) 15%, transparent); border: 1px dashed var(--free); }
.d.teacher-free span { color: var(--free); }

.row { display: grid; grid-template-columns: 50px 1fr; gap: 10px; margin-bottom: 12px; }
.no { display: flex; flex-direction: column; align-items: flex-end; padding-top: 14px; font-size: 12px; color: var(--mu); }
.no b { font-size: 15px; color: var(--tx); font-weight: 800; }
.card { display: block; width: 100%; text-align: left; padding: 14px 16px 14px 18px; position: relative; overflow: hidden; }
.card:before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--c); }
.lec { --c: var(--lec); } .pra { --c: var(--pra); } .lab { --c: var(--lab); } .oth { --c: var(--mu); }
.tp { font-size: 12px; font-weight: 700; color: var(--c); margin-bottom: 3px; text-transform: uppercase; }
.card h3 { font-size: 16px; font-weight: 700; line-height: 1.3; }
.meta { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 13px; color: var(--mu); }
.meta .rm { color: var(--tx); font-weight: 600; white-space: nowrap; }
.live .card { border-color: var(--ac); box-shadow: 0 0 0 2px var(--ac); }
.nt { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--ac); background: color-mix(in srgb, var(--ac) 15%, transparent); padding: 2px 8px; border-radius: 6px; }
.gap { margin: 0 0 12px 60px; padding: 8px 14px; border: 1px dashed var(--ln); border-radius: 18px; font-size: 12px; color: var(--mu); }
.empty { text-align: center; padding: 46px 20px; color: var(--mu); }
.empty b { display: block; font-size: 18px; color: var(--tx); margin-bottom: 6px; }

/* Шторки с кнопкой «✕» */
.sheet { position: fixed; inset: 0; display: none; z-index: 99; }
.sheet.on { display: block; }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.55); backdrop-filter: blur(4px); opacity: 0; animation: fadeIn .2s forwards; }
@keyframes fadeIn { to { opacity: 1; } }
.panel {
  position: absolute; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto;
  max-height: 88%; min-height: 40%; background: var(--bg); border-radius: 32px 32px 0 0;
  display: flex; flex-direction: column; padding: 12px 18px calc(20px + env(safe-area-inset-bottom, 0px));
  overflow-y: auto; scrollbar-width: none; touch-action: pan-y;
  transform: translateY(100%); animation: slideUp .26s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes slideUp { to { transform: translateY(0); } }
.panel-header-bar {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex: none;
}
.sheet-close-btn {
  width: 36px; height: 36px; border-radius: 50%; background: var(--gl); border: 1px solid var(--gb);
  display: grid; place-items: center; font-size: 16px; font-weight: 800; color: var(--mu); cursor: pointer;
}

/* Фон ИИ до входа: парящие ленты-вопросы */
.ai-locked-container {
  position: relative; min-height: 70vh; display: flex; align-items: center; justify-content: center;
  border-radius: 32px; overflow: hidden; padding: 30px 16px; margin-top: 10px;
}
.floating-queries {
  position: absolute; inset: -30px; display: flex; flex-direction: column; gap: 14px;
  opacity: 0.18; pointer-events: none; transform: rotate(-8deg) scale(1.05); user-select: none;
}
.f-row { display: flex; gap: 12px; white-space: nowrap; animation: marquee 25s linear infinite; }
.f-row:nth-child(even) { animation-direction: reverse; animation-duration: 32s; }
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.f-pill { padding: 10px 20px; border-radius: 99px; background: var(--tx); color: var(--bg); font-weight: 700; font-size: 15px; }

.ai-lock-card {
  position: relative; z-index: 2; text-align: center; max-width: 360px; padding: 26px 20px;
}
.ai-pulse-badge {
  width: 68px; height: 68px; border-radius: 50%; margin: 0 auto 16px;
  background: linear-gradient(135deg, #0075FF, #2FD39B); color: #fff;
  display: grid; place-items: center; box-shadow: 0 0 30px rgba(0,117,255,0.45);
  animation: pulseGlow 2.5s infinite ease-in-out;
}
@keyframes pulseGlow {
  0% { transform: scale(1); box-shadow: 0 0 16px rgba(0,117,255,0.3); }
  50% { transform: scale(1.08); box-shadow: 0 0 36px 6px rgba(47,211,155,0.45); }
  100% { transform: scale(1); box-shadow: 0 0 16px rgba(0,117,255,0.3); }
}

#toast {
  position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px));
  transform: translateX(-50%) translateY(-24px); background: rgba(11, 18, 31, 0.92);
  color: #EEF4FA; border: 1px solid rgba(255, 255, 255, 0.16);
  -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6);
  padding: 8px 18px; border-radius: 99px; font-size: 13px; font-weight: 700; z-index: 999;
  opacity: 0; pointer-events: none; transition: transform .22s cubic-bezier(0.16, 1, 0.3, 1), opacity .2s ease;
  box-shadow: 0 10px 30px rgba(0,0,0,.35); display: flex; align-items: center; gap: 8px; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

async function runAiCompress() {
  const el = $('lecture_text');
  const txt = el ? el.value.trim() : '';
  if (!txt) return toast('Вставьте текст лекции');
  const btn = $('btn_compress_ai'), resBox = $('ai_summary_result'), resContent =$('ai_summary_content');
  btn.disabled = true; btn.textContent = '🦉 Совёнок думает...'; resBox.style.display = 'none';
  try {
    const res = await fetch(`${API_URL}/api/ai_compress`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: txt, task: aiMode })
    });
    const data = await res.json();
    if (data.status === 'ok') {
      resContent.innerHTML = esc(data.result).replace(/\n/g, '<br>');
      resBox.style.display = 'block';
      toast('Готово!', '✓');
    } else {
      toast(data.message || 'Ошибка');
    }
  } catch (e) {
    toast('Сервер недоступен');
  } finally {
    btn.disabled = false;
    btn.textContent = '🦉 Сократить через Совёнок AI';
  }
}

function copyAiResult() {
  const t = $('ai_summary_content').innerText;
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast('Скопировано', '✓'));
}

function postAiMsg(text, isMe = false) {
  const c = $('ai_chat'); if(!c) return;
  const div = document.createElement('div');
  div.className = 'bub ' + (isMe ? 'me' : 'g');
  div.innerHTML = esc(text).replace(/\n/g, '<br>');
  c.appendChild(div);
  div.scrollIntoView({ behavior: 'smooth' });
}

function handleAiSend() {
  const inp = $('ai_input'), q = inp.value.trim();
  if (!q) return;
  postAiMsg(q, true);
  inp.value = '';
  setTimeout(() => postAiMsg('🦉 Совёнок AI на связи! Используй поле выше для сжатия лекций в тезисы.'), 280);
}

let authPollTimer = null;
let currentAuthCode = null;

function openAuthSheet() {
  currentAuthCode = Math.random().toString(36).substring(2, 8).toUpperCase();
  const botLink = `https://t.me/${BOT}?start=auth_${currentAuthCode}`;

  $('pnl').innerHTML = `

    </div>

      <span>${ico('tg', 20)}</span>
      <span>Открыть бота в Telegram</span>

    </div>

function startPollingAuth(authCode) {
  toast('Ожидаем подтверждения...', '💬');
  clearInterval(authPollTimer);
  authPollTimer = setInterval(async () => {
    try {
      const res = await fetch(`${API_URL}/api/auth_poll?code=${authCode}`);
      if (!res.ok) return;
      const data = await res.json();
      if (data.status === 'confirmed') {
        clearInterval(authPollTimer);
        applyAuth(data);
      }
    } catch(e){}
  }, 2000);
}

function verifyManualCode() {
  const el = $('manual_code');
  const code = el ? el.value.trim().toUpperCase() : '';
  if (!code || code.length < 4) return toast('Введите код');
  
  toast('Проверяем...', '⏳');
  fetch(`${API_URL}/api/auth_poll?code=${code}`)
    .then(r => r.json())
    .then(data => {
      if (data.status === 'confirmed') {
        clearInterval(authPollTimer);
        applyAuth(data);
      } else {
        toast('Код не найден или истёк', '✕');
      }
    })
    .catch(() => toast('Сервер недоступен', '✕'));
}

function applyAuth(data) {
  me = me || { org: 'НЧИ КФУ', fav: [] };
  me.tgUser = { id: data.user_id, username: data.username, first_name: data.first_name };
  if (data.target && DATA[data.target]) me.target = { k: 'g', n: data.target };
  sv('me', me);
  closeS();
  toast(`Вход: ${data.first_name}`, '✓');
  go(tab === 'a' ? 'a' : 'c');
}

function checkUrlAuth() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('auth_code');
  if (code) {
    fetch(`${API_URL}/api/auth_poll?code=${code}`)
      .then(r => r.json())
      .then(data => {
        if (data.status === 'confirmed') applyAuth(data);
      })
      .catch(() => {});
  }
}
