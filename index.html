<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E0E0F">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta name="apple-mobile-web-app-title" content="Расписание">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>Расписание НЧИ КФУ</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #E6EEF5; --gl: rgba(255,255,255,.75); --gb: rgba(255,255,255,.95); --ln: rgba(12,26,42,.1);
  --tx: #0C1A2A; --mu: #587087; --ac: #0075FF; --on: #ffffff;
  --lec: #3F5FD6; --pra: #12906A; --lab: #D6426A; --b1: #9FD6F0; --b2: #B8EBD8;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07121F; --gl: rgba(255,255,255,.075); --gb: rgba(255,255,255,.15); --ln: rgba(255,255,255,.1);
    --tx: #EEF4FA; --mu: #8EA2B8; --ac: #2FD39B; --on: #042018;
    --lec: #7C9CFF; --pra: #4FD1A5; --lab: #FF8FA3; --b1: #0f3554; --b2: #084337;
  }
}
:root[data-theme="dark"] {
  --bg: #07121F; --gl: rgba(255,255,255,.075); --gb: rgba(255,255,255,.15); --ln: rgba(255,255,255,.1);
  --tx: #EEF4FA; --mu: #8EA2B8; --ac: #2FD39B; --on: #042018;
  --lec: #7C9CFF; --pra: #4FD1A5; --lab: #FF8FA3; --b1: #0f3554; --b2: #084337;
}
* { box-sizing: border-box; margin: 0; font-family: Onest, system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; color: var(--tx); background: radial-gradient(70% 45% at 0% 0%, var(--b1), transparent 70%), radial-gradient(60% 45% at 100% 35%, var(--b2), transparent 70%), var(--bg); background-attachment: fixed; scrollbar-width: none; }
::-webkit-scrollbar { display: none; }
#app { height: 100%; display: flex; flex-direction: column; max-width: 520px; margin: 0 auto; }
#page { flex: 1; overflow-y: auto; padding: 0 16px 120px; scrollbar-width: none; }
.view-enter { animation: viewSlideIn .24s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
@keyframes viewSlideIn { from { opacity: 0; transform: translateY(12px) scale(0.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
button { border: 0; background: none; color: inherit; cursor: pointer; font-size: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
svg { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
h1 { font-size: 28px; font-weight: 800; letter-spacing: -.5px; }
h2 { font-size: 19px; font-weight: 800; margin: 22px 4px 10px; }
.mu { color: var(--mu); font-size: 13px; }
.g { background: var(--gl); border: 1px solid var(--gb); border-radius: 26px; -webkit-backdrop-filter: blur(26px) saturate(1.5); backdrop-filter: blur(26px) saturate(1.5); }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 16px 4px 10px; }
.pill { font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 99px; white-space: nowrap; display: inline-flex; align-items: center; cursor: pointer; }
.pill i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ac); margin-right: 7px; }
.ib { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; font-weight: 700; }
.box { padding: 16px 18px; margin-bottom: 12px; }
.hero { background: var(--ac); color: var(--on); border: 0; padding: 22px; border-radius: 30px; }
.hero .mu { color: inherit; opacity: .75; }
.hero h3 { font-size: 23px; font-weight: 800; margin: 6px 0 10px; line-height: 1.25; }
.bar { height: 6px; border-radius: 6px; background: var(--ln); margin-top: 14px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ac); }
.it { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 13px 4px; border-bottom: 1px solid var(--ln); }
.it:last-child { border: 0; }
.it b { display: block; font-weight: 700; font-size: 15px; }
.it small { display: block; font-size: 13px; color: var(--mu); margin-top: 2px; }
.it .t { flex: 1; min-width: 0; }
.it .t small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ic { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--ac) 18%, transparent); color: var(--ac); flex: none; }
.chev { color: var(--mu); flex: none; font-size: 18px; }
.lab2 { font-size: 13px; font-weight: 700; color: var(--mu); margin: 20px 8px 8px; }
.btn { display: block; width: 100%; padding: 15px; border-radius: 20px; background: var(--ac); color: var(--on); font-weight: 800; text-align: center; text-decoration: none; margin-top: 10px; font-size: 15px; }
.btn.gl { background: var(--gl); color: var(--tx); border: 1px solid var(--gb); }
.fld { width: 100%; padding: 14px 16px; border-radius: 18px; border: 1px solid var(--gb); background: var(--gl); color: var(--tx); font-size: 15px; margin: 6px 0 10px; outline: 0; }
textarea.fld { min-height: 100px; resize: none; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; border-radius: 18px; margin: 8px 0; }
.seg button { padding: 10px 4px; border-radius: 14px; font-weight: 700; color: var(--mu); font-size: 13px; }
.seg .on { background: var(--ac); color: var(--on); }
.dots { display: flex; gap: 10px; overflow-x: auto; padding: 4px; scrollbar-width: none; }
.dot { width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; }
.tabbar { position: fixed; left: 14px; right: 14px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); max-width: 492px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px; border-radius: 32px; z-index: 4; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--mu); padding: 8px 2px; border-radius: 24px; }
.tabbar .on { color: var(--ac); background: var(--ln); }
.who { text-align: left; min-width: 0; flex: 1; }
.who h1 { font-size: 25px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
.who small { display: block; font-size: 13px; color: var(--mu); max-width: 48vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day-nav-bar { display: flex; justify-content: space-between; align-items: center; padding: 4px 4px 10px; }
.day-nav-btn { font-size: 13px; font-weight: 700; padding: 7px 14px; border-radius: 99px; }
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 6px; margin-bottom: 14px; border-radius: 28px; }
.d { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 8px; border-radius: 22px; }
.d span { font-size: 11px; color: var(--mu); font-weight: 600; }
.d b { font-size: 18px; font-weight: 800; }
.d u { width: 5px; height: 5px; border-radius: 50%; background: var(--ln); }
.d.has u { background: var(--mu); }
.d.now b { color: var(--ac); }
.d.sel { background: var(--ac); color: var(--on); }
.row { display: grid; grid-template-columns: 50px 1fr; gap: 10px; margin-bottom: 12px; }
.no { display: flex; flex-direction: column; align-items: flex-end; padding-top: 14px; font-size: 12px; color: var(--mu); }
.no b { font-size: 15px; color: var(--tx); font-weight: 800; }
.card { display: block; width: 100%; text-align: left; padding: 14px 16px 14px 18px; position: relative; overflow: hidden; }
.card:before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--c); }
.lec { --c: var(--lec); } .pra { --c: var(--pra); } .lab { --c: var(--lab); } .oth { --c: var(--mu); }
.tp { font-size: 12px; font-weight: 700; color: var(--c); margin-bottom: 3px; text-transform: uppercase; }
.card h3 { font-size: 16px; font-weight: 700; line-height: 1.3; }
.meta { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 13px; color: var(--mu); }
.meta .rm { color: var(--tx); font-weight: 600; white-space: nowrap; }
.live .card { border-color: var(--ac); box-shadow: 0 0 0 2px var(--ac); }
.nt { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--ac); background: color-mix(in srgb, var(--ac) 15%, transparent); padding: 2px 8px; border-radius: 6px; }
.gap { margin: 0 0 12px 60px; padding: 8px 14px; border: 1px dashed var(--ln); border-radius: 18px; font-size: 12px; color: var(--mu); }
.empty { text-align: center; padding: 46px 20px; color: var(--mu); }
.empty b { display: block; font-size: 18px; color: var(--tx); margin-bottom: 6px; }
.slide { animation: sl .2s ease-out; }
@keyframes sl { from { opacity: .2; transform: translateX(var(--dx, 16px)); } }
#today { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--ac); color: var(--on); font-weight: 800; padding: 12px 20px; border-radius: 99px; box-shadow: 0 8px 24px rgba(0,0,0,.3); z-index: 3; }
.sheet { position: fixed; inset: 0; display: none; z-index: 6; }
.sheet.on { display: block; }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.5); backdrop-filter: blur(3px); }
.panel { position: absolute; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto; max-height: 88%; min-height: 40%; background: var(--bg); border-radius: 32px 32px 0 0; display: flex; flex-direction: column; padding: 10px 18px calc(18px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; scrollbar-width: none; touch-action: pan-y; }
.panel:before { content: ""; width: 44px; height: 5px; border-radius: 5px; background: var(--ln); margin: 4px auto 14px; flex: none; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
.ch { font-size: 12px; color: var(--mu); font-style: normal; font-weight: 700; padding: 6px 0; }
.cd { aspect-ratio: 1; border-radius: 50%; font-weight: 700; font-size: 14px; }
.cd.has { background: var(--ln); } .cd.now { color: var(--ac); } .cd.sel { background: var(--ac); color: var(--on); }
.onb { padding-top: 10vh; }
.onb p { color: var(--mu); margin: 6px 0 24px; font-size: 15px; }
.big { display: block; width: 100%; text-align: left; padding: 20px; font-size: 20px; font-weight: 800; margin-bottom: 12px; }
.big small { display: block; font-size: 13px; font-weight: 500; color: var(--mu); margin-top: 4px; }
.kfu-avatar-wrap { width: 96px; height: 96px; border-radius: 28px; background: #ffffff; border: 2px solid var(--ac); box-shadow: 0 8px 24px rgba(0, 117, 255, 0.22); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; overflow: hidden; padding: 6px; }
.kfu-avatar-wrap img { width: 100%; height: 100%; object-fit: contain; }
.bub { padding: 12px 16px; border-radius: 20px; margin-bottom: 10px; max-width: 90%; font-size: 14px; line-height: 1.4; }
.bub.me { margin-left: auto; background: var(--ac); color: var(--on); font-weight: 600; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.chip { padding: 8px 13px; border-radius: 99px; font-size: 13px; font-weight: 600; cursor: pointer; }
.ai-pulse-icon { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #0075FF, #2FD39B); display: grid; place-items: center; color: #fff; box-shadow: 0 0 20px rgba(0, 117, 255, 0.4); animation: aiPulse 2.4s infinite ease-in-out; }
@keyframes aiPulse { 0% { transform: scale(1); } 50% { transform: scale(1.06); box-shadow: 0 0 20px 8px rgba(47, 211, 155, 0.35); } 100% { transform: scale(1); } }
.ai-lock-overlay { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; gap: 16px; min-height: 50vh; }
#toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%) translateY(-24px); background: rgba(11, 18, 31, 0.9); color: #EEF4FA; border: 1px solid rgba(255, 255, 255, 0.16); -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6); padding: 8px 18px; border-radius: 99px; font-size: 13px; font-weight: 700; z-index: 99; opacity: 0; pointer-events: none; transition: transform .22s cubic-bezier(0.16, 1, 0.3, 1), opacity .2s ease; box-shadow: 0 10px 30px rgba(0,0,0,.35); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* v1.7: палитра, полоска дней, компактный список, ИИ */
:root{--bg:#F4F1FA;--b1:#DCCFFF;--b2:#BFE9FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0A0D1C;--b1:#2B1F6E;--b2:#0B4A63}}
:root[data-theme="dark"]{--bg:#0A0D1C;--b1:#2B1F6E;--b2:#0B4A63}
.d.sel{background:var(--acg);box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 40%,transparent)}
.d.sel b,.d.sel span{color:var(--on)}.d.sel u{background:var(--on)}.d.now:not(.sel) b{color:var(--ac)}
.hero,.btn:not(.gl),.av{background:var(--acg);color:var(--on)}
.av{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:800;margin:0 auto 10px}
.cmp{padding:0;overflow:hidden;margin-bottom:12px}
.cmp-h{display:flex;justify-content:space-between;align-items:center;padding:12px 8px 12px 20px;font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mu);border-bottom:1px solid var(--ln)}
.cmp-c{color:var(--ac);display:grid;place-items:center;width:38px;height:38px}
.cr{display:block;width:100%;text-align:left;padding:14px 20px;border-bottom:1px solid var(--ln)}.cr:last-child{border:0}
.cr-t{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mu);font-weight:600}.cr-t .tm{margin-left:auto;font-variant-numeric:tabular-nums}
.nb{margin-left:-20px;padding:0 12px 0 20px;height:26px;border-radius:0 13px 13px 0;background:var(--ln);color:var(--tx);font-weight:800;display:inline-grid;place-items:center}
.nb.on{background:var(--acg);color:var(--on)}
.cr-n{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:17px;font-weight:700;margin-top:6px}
.cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pn{color:var(--mu);flex:none;display:grid}.pn.on{color:var(--ac)}
.cr-r{font-size:14px;color:var(--mu);margin-top:3px}
.tiles,.qchips{display:flex;gap:10px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px}
.tile{flex:none;width:136px;height:104px;border-radius:26px;padding:14px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;font-weight:800;font-size:15px;color:#fff}
.qc{flex:none;padding:9px 15px;border-radius:99px;font-weight:700;font-size:13px}
.composer{position:sticky;bottom:96px;padding:10px 0 4px;background:linear-gradient(transparent,var(--bg) 35%)}
.composer textarea{margin:0;flex:1;min-height:52px;max-height:130px;resize:none;padding:15px 18px}
.cstep{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--acg);color:var(--on);flex:none}

/* v1.8: аватар, сова, статичный чат ИИ */
.ava{display:inline-grid;place-items:center;border-radius:50%;background:#fff;overflow:hidden;flex:none;box-shadow:0 0 0 2px var(--gb)}
.ava img{width:86%;height:86%;object-fit:contain}.ava svg{width:84%;height:84%}
#page.ai{overflow:hidden;padding-bottom:98px;display:flex;flex-direction:column}
.aiwrap{flex:1;display:flex;flex-direction:column;min-height:0}
.aichat{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 0 10px}
.aiwrap .qchips{margin:0 -16px 8px}
.composer{position:static;display:flex;gap:8px;align-items:flex-end;flex:none;padding:0;background:none}
.msg{display:flex;gap:8px;align-items:flex-end}.msg .bub{max-width:calc(100% - 42px)}
.aitools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.aitools .pill{font-size:12px;padding:6px 12px}
.aitools .pill.on{background:var(--acg);color:var(--on)}

/* v2.0: плоский стиль без градиентов и стекла, одна синяя краска */
:root{--bg:#F2F2F7;--sf:#fff;--gl:#fff;--gb:transparent;--ln:#E5E5EA;--tx:#111;--mu:#6C6C70;--ac:#2F7BF5;--on:#fff;--acg:#2F7BF5;--btn2:#E5E5EA;--lec:#7A63B8;--pra:#E58A00;--lab:#2F7BF5;--cur:#3AA7E0;--b1:transparent;--b2:transparent}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E0E0F;--sf:#1C1C1E;--gl:#1C1C1E;--gb:transparent;--ln:#2C2C2E;--tx:#fff;--mu:#8E8E93;--btn2:#3A3A3C;--lec:#9B87D1;--pra:#FFA726;--lab:#4A90FF;--cur:#5AB8E8;--b1:transparent;--b2:transparent}}
:root[data-theme="dark"]{--bg:#0E0E0F;--sf:#1C1C1E;--gl:#1C1C1E;--gb:transparent;--ln:#2C2C2E;--tx:#fff;--mu:#8E8E93;--btn2:#3A3A3C;--lec:#9B87D1;--pra:#FFA726;--lab:#4A90FF;--cur:#5AB8E8;--b1:transparent;--b2:transparent}
html,body{background:var(--bg);background-attachment:scroll}
.g{background:var(--sf);border:0;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;border-radius:24px}
h1{font-size:24px;font-weight:600;letter-spacing:0}h2{font-size:18px;font-weight:600}
.hero{background:var(--sf);color:var(--tx);border:0}
.hero .mu{color:var(--ac);opacity:1;font-weight:600}.hero h3{font-size:20px;font-weight:600;margin:6px 0 4px}
.hero .bar{background:var(--ln)}.hero .bar i,.bar i{background:var(--ac)}
.btn:not(.gl){background:var(--ac);color:#fff;border-radius:26px;font-weight:600}
.btn.gl{background:var(--btn2);color:var(--tx);border:0;border-radius:26px;font-weight:600}
.ava{box-shadow:none;background:#fff}.av{background:var(--ac);color:#fff}
.tabbar{background:var(--sf);border:1px solid var(--ln);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
.tabbar button{font-weight:600}.tabbar .on{background:var(--bg);color:var(--ac)}
.strip{background:none;padding:0;border-radius:0}
.d.sel{background:var(--ac);box-shadow:none;border-radius:18px}.d.sel b,.d.sel span{color:#fff}.d.sel u{background:#fff}.d.now:not(.sel) b{color:var(--ac)}
.nb{background:var(--ln);color:var(--tx);font-weight:700}.nb.on{background:var(--cur);color:#04202c}
.cmp-h{justify-content:flex-start;gap:4px;padding:8px 8px 8px 10px;font-weight:600;letter-spacing:.3px}
.cmp-d{flex:1;text-align:center}
.ar{width:36px;height:36px;border-radius:50%;font-size:24px;line-height:1;color:var(--mu);flex:none}.ar:active{background:var(--ln)}
.cr-n{font-weight:600}
.day-nav-bar{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px}.day-nav-bar b{font-size:15px;font-weight:600}
.ic{background:none;color:var(--ac);width:30px;height:30px;border-radius:0}
.it{padding:15px 4px}.it b{font-weight:500;font-size:17px}
.lab2{font-size:15px;font-weight:600;color:var(--mu);margin:26px 14px 8px;letter-spacing:0}
.pad{padding:2px 16px}.prow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px}
.prow b{display:block;font-weight:600;font-size:18px}.prow small{display:block;color:var(--mu);font-size:14px;margin-top:2px}.prow .t{flex:1}
.plain{display:block;width:100%;text-align:center;color:#FF6B6B;padding:14px;margin-top:18px;font-weight:500}
.verb{display:block;width:100%;text-align:center;padding:10px;margin-top:4px}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.seg.g{background:var(--sf)}.seg .on{background:var(--ac);color:#fff}
.dots{display:flex;gap:12px;overflow-x:auto;background:var(--sf);border-radius:28px;padding:14px}
.dot{flex:none;width:46px;height:46px;border-radius:50%;box-shadow:none;color:#fff;display:grid;place-items:center}
.bub.g{background:var(--sf)}.bub.me{background:var(--ac);color:#fff;font-weight:500}
.aiwrap .qchips{flex-wrap:wrap;overflow:visible;margin:0 0 8px;gap:6px;padding:0}

function build() {
  T = {};
  for (const g in DATA) {
    const s = DATA[g].schedule || {};
    for (const w in s) {
      for (const d in s[w]) {
        for (const l of s[w][d]) {
          const n = (l.teacher || '').trim();
          if (!n || n === '—') continue;
          ((T[n] ??= {})[w] ??= {})[d] ??= [];
          T[n][w][d].push({ ...l, group: g });
        }
      }
    }
  }
}

function getWeek(d) { return manualWeek || wcode(d); }

function lessonsOf(t, w, d) {
  if (!t) return [];
  if (t.k === 'g') return (DATA[t.n]?.schedule?.[w]?.[d] || []).map(l => ({ ...l }));
  const m = {};
  for (const l of (T[t.n]?.[w]?.[d] || [])) {
    const k = l.time + l.room + l.subject;
    if (m[k]) { if (!m[k].group.includes(l.group)) m[k].group += ', ' + l.group; }
    else m[k] = { ...l };
  }
  return Object.values(m).sort((a, b) => a.time.localeCompare(b.time));
}

const span = l => { const st = l.time.slice(0, 5), b = BELLS[st]; return [mins(st), b ? mins(b[0]) : mins(st) + 90]; };
const cls = t => /лек/i.test(t) ? 'lec' : /лаб/i.test(t) ? 'lab' : /пр|сем/i.test(t) ? 'pra' : 'oth';

function status(t, now) {
  const gi = now.getDay(), nm = now.getHours() * 60 + now.getMinutes();
  const L = gi ? lessonsOf(t, getWeek(now), DN[gi - 1]) : [];
  let live = null, next = null;
  for (const l of L) {
    const [s, e] = span(l);
    if (nm >= s && nm < e) live = { l, s, e };
    else if (s > nm && !next) next = { l, s, e };
  }
  return { live, next, L, nm };
}

const where = l => 'ауд. ' + esc(l.room) + (l.building ? ', ' + esc(l.building) : '');

function stLine(t, now) {
  const s = status(t, now);
  if (s.live) return `Сейчас: ${where(s.live.l)}`;
  if (s.next) return `Дальше: ${s.next.l.time.slice(0, 5)} · ${where(s.next.l)}`;
  return t.k === 't' ? (s.L.length ? 'Занятия завершены' : 'Сегодня занятий нет') : (s.L.length ? 'Все пары завершены' : 'Сегодня пар нет');

function weekStatsHtml(t, now) {
  const m = mon(now), tch = t.k === 't', names = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'], days = [], others = new Set();
  let total = 0, busiest = 0, bmax = 0, win = 0, winDay = '';
  for (let i = 0; i < 6; i++) {
    const d = new Date(m); d.setDate(m.getDate() + i);
    const L = lessonsOf(t, getWeek(d), DN[i]);
    days.push(L.length); total += L.length;
    if (L.length > bmax) { bmax = L.length; busiest = i; }
    L.forEach((l, k) => {
      (tch ? String(l.group || '').split(', ') : [String(l.teacher || '')]).forEach(x => x && others.add(x));
      if (k) { const g = span(l)[0] - span(L[k - 1])[1]; if (g > win) { win = g; winDay = names[i]; } }
    });
  }
  if (!total) return '';
  const free = names.filter((_, i) => !days[i]), e = new Date(m); e.setDate(m.getDate() + 6);
  const today = (now.getDay() + 6) % 7, max = Math.max(...days, 1), lab = getWeek(now) === 'в' ? 'верхняя' : 'нижняя';
  const bars = days.map((c, i) => `<button class="wb${i === today ? ' now' : ''}" data-a="wday" data-v="${i}"><span>${c || ''}</span><i style="height:${c ? 10 + Math.round(c / max * 48) : 4}px"></i><em>${names[i]}</em></button>`).join('');
  const hrs = String(total * 1.5).replace('.', ',');
  const note = tch
    ? `Групп на неделе: ${others.size}. ${free.length ? 'Свободные дни: ' + free.join(', ') + '.' : 'Свободных дней нет.'}`
    : ((free.length ? 'Дни без пар: ' + free.join(', ') + '.' : 'Пары каждый день.') + (win >= 60 ? ` Самое длинное окно ${dur(win)}, ${winDay}.` : ''));
  return `<div class="box g wkstat"><div class="ws-h"><b>Эта неделя</b><span class="mu">${lab}, ${m.getDate()}-${e.getDate()} ${MO[e.getMonth()]}</span></div><div class="ws-bars">${bars}</div><div class="ws-row"><div><b>${total}</b><small>${plural(total, tch ? ['занятие', 'занятия', 'занятий'] : ['пара', 'пары', 'пар'])}</small></div><div><b>${hrs} ч</b><small>${tch ? 'у доски' : 'на парах'}</small></div><div><b>${names[busiest]}</b><small>самый плотный</small></div></div><div class="mu ws-note">${note}</div></div>`;
}

  sv.style.setProperty('--sbg', bg); sv.style.setProperty('--sfg', fg);
  sv.innerHTML = `<div class="sv-bars">${SV.list.map((_, k) => `<span class="${k < SV.i ? 'full' : ''}"><i class="${k === SV.i ? 'run' : ''}"></i></span>`).join('')}</div>
    <button class="sv-x" data-a="storyx" aria-label="Закрыть">${ico('x', 22)}</button>
    <div class="sv-tap"><button data-a="storyprev" aria-label="Назад"></button><button data-a="storynext" aria-label="Дальше"></button></div>
    <div class="sv-body"><div class="sv-em">${storyIconFor(s.id, 124)}</div><div class="sv-ks">${esc(s.s)}</div><h2>${esc(s.t)}</h2><p>${esc(s.p)}</p></div>
    <button class="sv-cta" data-a="storygo">${esc(s.b)}</button>`;
  clearTimeout(SV.tm); SV.tm = setTimeout(() => storyStep(1), 7000);
  const seen = ld('seen') || []; if (!seen.includes(s.id)) { seen.push(s.id); sv_save('seen', seen); }
  document.querySelectorAll('.story').forEach(b => { if (seen.includes(b.dataset.sid)) b.classList.add('seen'); });
}

function storyOpen(i, rect) {
  SV.list = storyList(); SV.i = +i; const sv = $('story');
  if (rect) sv.style.transformOrigin = `${rect.left + rect.width / 2}px ${rect.top + rect.height / 2}px`;
  storyDraw(); void sv.offsetWidth; sv.classList.add('on');
}
function storyStep(d) { SV.i += d; if (SV.i < 0) SV.i = 0; if (SV.i >= SV.list.length) return storyClose(); storyDraw(); }
function storyClose() { clearTimeout(SV.tm); $('story').classList.remove('on'); }

const PENCIL = '<svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5a2.1 2.1 0 0 1 3 3L8 19zM14 7l3 3"/></svg>';
const shortType = t => { t = (t || '').toLowerCase(); return t.startsWith('лек') ? 'лек.' : t.startsWith('лаб') ? 'лаб.' : t.startsWith('пр') ? 'пр.' : (t || 'пара'); };

// --- ШЕРИНГ РАСПИСАНИЯ НА ДЕНЬ (БЕЗ ВЕРХНЕЙ ССЫЛКИ И БЕЗ ПУСТЫХ СТРОК) ---
function shareScheduleDay(targetDate) {
  if (!me || !me.target) return;
  const clean = s => String(s || '').replace(/\s+/g, ' ').trim();
  const t = me.target;
  const d = targetDate || date || ds(NOW());
  const gi = d.getDay();
  const w = getWeek(d);
  const wd = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'][gi];
  const L = gi === 0 ? [] : lessonsOf(t, w, DN[gi - 1]);
  const whoLabel = t.k === 't' ? `Преподаватель ${clean(t.n)}` : `Группа ${clean(t.n)}`;
  const wkLabel = w === 'в' ? 'верхняя неделя' : 'нижняя неделя';

  const lines = [`📅 ${wd}, ${d.getDate()} ${MO[d.getMonth()]} (${wkLabel})`, `👥 ${whoLabel}`, ''];
  if (!L.length) {
    lines.push('🎉 Пар нет! Свободный день.');
  } else {
    L.forEach((l, i) => {
      const [a, e] = span(l);
      const no = (BELLS[l.time.slice(0, 5)] || [])[1] || (i + 1);
      const tp = l.type ? ` (${clean(shortType(l.type))})` : '';
      const loc = [l.room ? `ауд. ${clean(l.room)}` : '', clean(l.building)].filter(Boolean).join(', ');
      const extra = t.k === 't' ? (l.group ? ` · гр. ${clean(l.group)}` : '') : (l.teacher ? ` · ${clean(l.teacher)}` : '');
      lines.push(`${no}. ${hm(a)}–${hm(e)} · ${clean(l.subject)}${tp}${loc ? ' — ' + loc : ''}${extra}`);
    });
  }
  lines.push('', `🦉 Расписание НЧИ КФУ: @${BOT}`);
  const fullText = lines.join('\n');
  const shareUrl = `https://t.me/share/url?url=&text=${encodeURIComponent(fullText)}`;

  if (TG && typeof TG.openTelegramLink === 'function' && TG.initData) {
    try { TG.openTelegramLink(shareUrl); return; } catch (e) {}
  }
  if (navigator.clipboard) {
    navigator.clipboard.writeText(fullText).then(
      () => toast('Расписание скопировано!', '✓'),
      () => {}
    );
  }
  window.open(shareUrl, '_blank');
}

async function loadFeedbackStatus() {
  try {
    const r = await fetch(`${API_URL}/api/feedback_status`);
    const d = await r.json();
    if (d && d.status === 'ok') {
      FB_ENABLED = Boolean(d.enabled);
      sv('fb_enabled_local', FB_ENABLED);
    }
  } catch (e) {}
  maybeShowFeedbackPopup();
}

function maybeShowFeedbackPopup() {
  if (!me || !me.target || !FB_ENABLED || ld('feedback_sent') || FB_SHOWN_ONCE) return;
  if ($('sheet').classList.contains('on') || $('adm').classList.contains('on')) return;
  FB_SHOWN_ONCE = true;
  setTimeout(() => {
    if ($('sheet').classList.contains('on') || $('adm').classList.contains('on')) return;
    openFeedbackSheet();
  }, 600);
}

function compactDay(t, d) {

  L.forEach((l, i) => {
    const [a, e] = span(l), live = today && nm >= a && nm < e, note = NOTES[nk(d, l)], no = (BELLS[l.time.slice(0, 5)] || [])[1] || i + 1;
    h += `<button class="cr" data-a="les" data-v="${i}"><div class="cr-t"><span class="nb${live ? ' on' : ''}">${no}</span><span>${esc(shortType(l.type))}</span><span class="tm">${hm(a)} - ${hm(e)}</span></div><div class="cr-n"><span class="cn">${esc(l.subject)}</span><span class="pn${note ? ' on' : ''}">${PENCIL}</span></div><div class="cr-w">${esc(t.k === 't' ? (l.group || '') : (l.teacher || ''))}</div><div class="cr-r">${l.room ? 'ауд.' + esc(l.room) : ''}${l.building ? (l.room ? ', ' : '') + esc(l.building) : ''}</div></button>`;

}

function home() {
  const now = NOW();
  const s = status(me.target, now);
  const isFinished = !s.live && !s.next && s.L.length > 0;
  const isWeekend = now.getDay() === 0 || s.L.length === 0;

  let h = `
    <div class="top">
      <div class="who" style="display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center"><span style="grid-row:span 2">${ava(52)}</span><h1>Привет${dispName() ? ', ' + esc(dispName()) : ''}</h1>
        <small>${esc(me.target.n)} · ${now.getDate()} ${MO[now.getMonth()]}</small>
      </div>
      <div style="flex-shrink:0;">${wkPill(now)}</div>
    </div>`;

  h += storiesHtml();
  h += annHtml();
  if (s.live) {
    const l = s.live.l, durM = s.live.e - s.live.s, el = s.nm - s.live.s, pct = Math.max(0, Math.min(100, Math.round(el / durM * 100)));
    h += `<div class="box hero"><div class="mu">Идёт прямо сейчас · до звонка ${s.live.e - s.nm} мин</div><h3>${esc(l.subject)}</h3><div>${where(l)} ${l.group ? '· ' + esc(l.group) : ''}</div><div class="bar"><i></i></div></div>`;
    setTimeout(() => { const b = document.querySelector('.hero .bar i'); if (b) b.style.width = pct + '%'; }, 20);
  } else if (s.next) {
    const l = s.next.l, gap = s.next.s - s.nm, tip = winTip(gap);
    h += `<div class="box hero"><div class="mu">${isT() ? 'Следующее занятие' : 'Следующая пара'} через ${dur(gap)}</div><h3>${esc(l.subject)}</h3><div>${l.time.slice(0, 5)} · ${where(l)}${isT() && l.group ? ' · ' + esc(l.group) : ''}</div>${tip ? `<div style="margin-top:8px;opacity:.7;font-size:14px">${tip}</div>` : ''}</div>`;
  } else if (isFinished) {
    const em = emptyMsg(me.target, 'done');
    h += `<div class="box hero"><div class="mu">${em.t}</div><h3>${em.h}</h3><div>${em.s}</div></div>`;
  } else {
    const em = emptyMsg(me.target, now.getDay() === 0 ? 'sun' : 'free');
    h += `<div class="box hero"><div class="mu">${em.t}</div><h3>${em.h}</h3><div>${em.s}</div></div>`;
  }

  const tomorrow = new Date(now); tomorrow.setDate(tomorrow.getDate() + 1);
  h += compactDay(me.target, homeD || ((isFinished || isWeekend) ? tomorrow : now));
  h += weekStatsHtml(me.target, now);

  if (me.fav && me.fav.length) {
    h += `<h2>Избранное</h2><div class="box g" style="padding:4px 16px">`;
    h += me.fav.map(f => item(f.k === 'g' ? 'users' : 'user', f.n, stLine(f, now), 'who', key(f))).join('');
    h += `</div>`;
  }
  $('page').innerHTML = h;
}

const dk = d => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
const nk = (d, l) => dk(d) + '|' + l.time.slice(0, 5) + '|' + l.subject;

function dayHtml(t, d, click) {
  const now = NOW(), w = getWeek(d), gi = d.getDay();
  const L = gi === 0 ? [] : lessonsOf(t, w, DN[gi - 1]);
  const today = same(d, now), nm = now.getHours() * 60 + now.getMinutes();
  const tchEm = emptyMsg(t, gi === 0 ? 'sun' : 'none');
  if (!L.length) return `<div class="empty"><b>${gi === 0 ? tchEm.h : tchEm.t}</b>${tchEm.s}</div>`;

  const f = span(L[L.length - 1]);
  let h = `<div class="mu" style="margin:0 4px 12px">${L.length} ${plural(L.length, t.k === 't' ? ['занятие', 'занятия', 'занятий'] : ['пара', 'пары', 'пар'])} · до ${hm(f[1])}</div>`;

  L.forEach((l, i) => {
    const [a, e] = span(l);
    if (i > 0) {
      const prev = span(L[i - 1]), g = a - prev[1];
      if (g > 10) h += `<div class="gap">Окно ${dur(g)} (${hm(prev[1])} – ${hm(a)})</div>`;
    }
    const no = `<div class="no"><b>${i + 1}</b><span>${l.time.slice(0, 5)}</span><span>${hm(e)}</span></div>`;
    const live = today && nm >= a && nm < e, note = NOTES[nk(d, l)];
    h += `<div class="row${live ? ' live' : ''}">${no}<div><button class="card g ${cls(l.type)}" ${click ? `data-a="les" data-v="${i}"` : ''}><div class="tp">${esc(l.type || 'Пара')}</div><h3>${esc(l.subject)}</h3><div class="meta"><span>${esc(t.k === 't' ? (l.group || '') : (l.teacher || ''))}</span><span class="rm">${esc(l.room)}${l.building ? ', ' + esc(l.building) : ''}</span></div>${note ? `<div class="nt"> ${esc(note)}</div>` : ''}</button></div></div>`;
  });
  return h;
}

function aiAnswer(q) {
  const s = q.toLowerCase(), words = s.split(/[^а-яё0-9]+/).filter(Boolean), nz = x => x.toLowerCase().replace(/[^a-z0-9а-яё]/g, ''), nq = nz(q), now = NOW();
  if (words.some(w => ['такое', 'значит', 'означает', 'почему', 'зачем', 'объясни', 'расскажи', 'реши', 'докажи', 'напиши', 'переведи', 'определение', 'формула', 'идея', 'придумай', 'составь'].includes(w))) return null;
  let t = me.target, groupNamed = false, teacherNamed = false;
  const g = Object.keys(DATA).find(k => k.length >= 4 && nq.includes(nz(k)));
  if (g) { t = { k: 'g', n: g }; groupNamed = true; }
  else {
    const tn = Object.keys(T).find(n => { const sn = n.split(' ')[0].toLowerCase(); if (sn.length < 4) return false; const stem = sn.replace(/[аяь]$/, ''); return words.some(w => w.length >= 4 && w.startsWith(stem) && w.length <= stem.length + 3); });
    if (tn) { t = { k: 't', n: tn }; teacherNamed = true; }
  }
  const WD = [['понедельник', 'понедельника'], ['вторник', 'вторника'], ['среда', 'среду'], ['четверг', 'четверга'], ['пятница', 'пятницу'], ['суббота', 'субботу']];
  let d = new Date(now), lab = 'сегодня', dayHit = false;
  if (words.includes('послезавтра')) { d.setDate(d.getDate() + 2); lab = 'послезавтра'; dayHit = true; }
  else if (words.includes('завтра')) { d.setDate(d.getDate() + 1); lab = 'завтра'; dayHit = true; }
  else if (words.includes('сегодня')) dayHit = true;
  else {
    const wi = WD.findIndex(a => a.some(w => words.includes(w)));
    if (wi >= 0) { for (let i = 0; i < 7; i++) { const x = new Date(now); x.setDate(x.getDate() + i); if (x.getDay() === wi + 1) { d = x; break; } } lab = WD[wi][1]; dayHit = true; }
  }
  const has = list => words.some(w => list.includes(w));
  const parW = has(['пара', 'пары', 'пар', 'паре', 'пару', 'парах', 'расписание', 'расписания', 'занятие', 'занятия', 'занятий']);
  const whereW = has(['где', 'кабинет', 'аудитория', 'аудитории', 'ауд']);
  const whoW = has(['препод', 'преподаватель', 'преподавателя', 'друг', 'друга', 'сейчас', 'группа', 'группы']);
  const asks = has(['что', 'какие', 'какая', 'есть']);
  if (!(parW || groupNamed || (whereW && (teacherNamed || whoW)) || (dayHit && (asks || teacherNamed)))) return null;
  const tc = t.k === 't';
  if ((whereW || words.includes('сейчас')) && lab === 'сегодня') {
    const st = status(t, now), clean = x => x.replace(/&amp;/g, '&');
    if (st.live) return tc ? `${t.n} сейчас ведёт «${st.live.l.subject}»\nгруппа ${st.live.l.group}, ${clean(where(st.live.l))}, до ${hm(st.live.e)}` : `${t.n} сейчас на паре «${st.live.l.subject}»\n${clean(where(st.live.l))}, до ${hm(st.live.e)}`;
    if (st.next) return `${t.n} сейчас без ${tc ? 'занятия' : 'пары'}. Дальше в ${hm(st.next.s)}: «${st.next.l.subject}»\n${clean(where(st.next.l))}`;
    return `${t.n}: ${st.L.length ? emptyMsg(t, 'done').t.toLowerCase() : emptyMsg(t, 'free').t.toLowerCase()}`;
  }
  const gi = d.getDay(), L = gi === 0 ? [] : lessonsOf(t, getWeek(d), DN[gi - 1]);
  if (!L.length) return `${t.n}, ${lab} (${d.getDate()} ${MO[d.getMonth()]}): ${tc ? 'занятий нет' : 'пар нет'}`;
  return `${t.n}, ${lab} (${d.getDate()} ${MO[d.getMonth()]}):\n` + L.map((l, i) => `${i + 1}. ${hm(span(l)[0])}-${hm(span(l)[1])} ${l.subject}, ${l.room ? 'ауд. ' + l.room : 'без аудитории'}${l.building ? ' (' + l.building + ')' : ''}${tc && l.group ? ', ' + l.group : ''}`).join('\n');
}

async function aiCompress(text, style) {
  aiMode = style; AILEC = text;
  AICHAT.push({ me: 0, t: 'Совёнок думает…' }); aiRender();
  const idx = AICHAT.length - 1;
  try {
    const r = await fetch(`${API_URL}/api/ai_compress`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, task: style, user_id: me && me.tgUser ? me.tgUser.id : 0 }) });
    const d = await r.json();
    AICHAT[idx] = d.status === 'ok' ? { me: 0, t: d.result, cp: 1 } : { me: 0, t: d.message || 'Не получилось, попробуй ещё раз' };
    if (d.status === 'ok') AILAST = d.result;
  } catch (e) { AICHAT[idx] = { me: 0, t: 'Сервер недоступен, попробуй позже' }; }
  aiRender();
}

async function aiAsk(q) {
  const hist = AICHAT.filter(m => m.t && m.t !== 'Совёнок думает…').slice(-7, -1).map(m => ({ role: m.me ? 'user' : 'assistant', content: String(m.t).slice(0, 600) }));
  AICHAT.push({ me: 0, t: 'Совёнок думает…' }); aiRender();
  const idx = AICHAT.length - 1;
  try {
    const r = await fetch(`${API_URL}/api/ai_chat`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: q, history: hist, role: isT() ? 'teacher' : 'student', user_id: me && me.tgUser ? me.tgUser.id : 0 }) });
    const d = await r.json();
    AICHAT[idx] = { me: 0, t: d.result || d.message || 'Не получилось ответить, попробуй ещё раз' };
  } catch (e) { AICHAT[idx] = { me: 0, t: 'Сервер недоступен, попробуй позже' }; }
  aiRender();
}

async function aiSend(txt) {
  const inp = $('ai_input'), q = (typeof txt === 'string' ? txt : (inp ? inp.value : '')).trim();
  if (!q) return;
  if (inp) { inp.value = ''; inp.style.height = 'auto'; }
  const lecture = q.length > 300 || q.split(/\s+/).length > 50 || /^(сожми|сократи|конспект|тезис|упрости)/i.test(q);
  AICHAT.push({ me: 1, t: q.length > 200 ? q.slice(0, 120) + '… (лекция, ' + q.length + ' симв.)' : q });
  if (!lecture) { const ans = aiAnswer(q); if (ans) { AICHAT.push({ me: 0, t: ans }); return aiRender(); } aiRender(); return aiAsk(q); }
  await aiCompress(q, aiMode);
}

        if (data.status === 'confirmed') {
          me = me || { org: 'НЧИ КФУ', fav: [] };
          me.tgUser = { id: data.user_id, username: data.username, first_name: data.first_name };
          if (data.target && DATA[data.target]) me.target = { k: 'g', n: data.target };
          sv('me', me);
          toast(`Вход: ${data.first_name}`, '✓');
          trackSession('open_app');
          go('a');
        }
      })
      .catch(() => {});
  }
}

// --- ТРЕКИНГ СЕССИИ И АКТИВНОСТИ ---
function detectPlatform() {
  if (TG && TG.platform && TG.platform !== 'unknown') return TG.platform;
  const ua = navigator.userAgent.toLowerCase();
  if (/iphone|ipad|ipod/.test(ua)) return 'ios';
  if (/android/.test(ua)) return 'android';
  if (/win|mac|linux/.test(ua)) return 'tdesktop';
  return 'web';
}

function trackSession(eventType = 'open_app', detail = '') {
  try {
    const u = (me && me.tgUser) || tgU || {};
    const payload = {
      user_id: u.id || 0,
      username: u.username || '',
      first_name: u.first_name || (me && me.nick) || '',
      group_name: (me && me.target && me.target.n) || '',
      role: (me && me.target && me.target.k) || 'g',
      platform: detectPlatform(),
      event_type: eventType,
      detail: detail
    };
    fetch(`${API_URL}/api/track_session`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).catch(() => {});
  } catch (e) {}
}

function admApi(path, body) {
  const tk = ADM_TOKEN || ADMIN_PIN;
  const sep = path.includes('?') ? '&' : '?';
  return fetch(`${API_URL}${path}${body ? '' : sep + 'token=' + encodeURIComponent(tk)}`, body ? {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...body, token: tk })
  } : {}).then(r => r.json());
}

function platBadge(p) {
  const s = String(p || '').toLowerCase();
  if (s.includes('ios') || s.includes('macos')) return '🍎 iOS';
  if (s.includes('android')) return '🤖 Android';
  if (s.includes('tdesktop') || s.includes('desktop')) return '💻 Desktop';
  if (s.includes('bot')) return '✈️ Бот';
  return '🌐 Web';
}

function fmtAgo(ts) {
  if (!ts) return 'недавно';
  const d = new Date(String(ts).replace(' ', 'T') + (String(ts).includes('Z') ? '' : 'Z'));
  if (isNaN(d)) return String(ts).slice(0, 16);
  const diffM = Math.max(0, Math.floor((Date.now() - d.getTime()) / 60000));
  if (diffM < 2) return 'только что';
  if (diffM < 60) return `${diffM} мин назад`;
  const diffH = Math.floor(diffM / 60);
  if (diffH < 24) return `${diffH} ч назад`;
  return `${d.getDate()} ${MO[d.getMonth()]} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

async function fetchAdmUsers() {

    if (d && d.status === 'ok') { admUsersCache = d.users || []; if ($('adm').classList.contains('on') && admTab === 'users') adminOpen(); }

}

async function admAct(a, btn) {
  if (!ADM_TOKEN) ADM_TOKEN = ADMIN_PIN;
  if (a.startsWith('tab_')) {
    admTab = a.replace('tab_', '');
    if (admTab === 'overview' || admTab === 'ai') fetchAdmOverview();
    if (admTab === 'users') fetchAdmUsers();
    return adminOpen();
  }
  if (a === 'toggle_fb') {
    FB_ENABLED = !FB_ENABLED;
    sv('fb_enabled_local', FB_ENABLED);
    try {
      const d = await admApi('/api/admin/toggle_feedback', {});
      if (d && d.status === 'ok') {
        FB_ENABLED = Boolean(d.enabled);
        sv('fb_enabled_local', FB_ENABLED);
      }
    } catch (e) {}
    toast(FB_ENABLED ? 'Сбор отзывов включён' : 'Сбор отзывов выключен');
    adminOpen();
    return;
  }
  if (a === 'usort_active' || a === 'usort_launches') {
    admUserSort = a === 'usort_launches' ? 'launches' : 'active';
    return fetchAdmUsers();
  }
  if (a === 'ublock' && btn) {
    const uid = +btn.dataset.uid;
    try {
      const d = await admApi('/api/admin/user_action', { action: 'toggle_block', user_id: uid });
      if (d.status === 'ok') { toast(d.is_blocked ? 'Пользователь заблокирован' : 'Разблокирован'); fetchAdmUsers(); }
    } catch (e) { toast('Сервер недоступен'); }
    return;
  }
  if (a === 'ugrp' && btn) {
    const uid = +btn.dataset.uid, cur = btn.dataset.grp || '';
    const g = prompt('Новая группа для пользователя:', cur);
    if (g && g.trim()) {
      try {
        const d = await admApi('/api/admin/user_action', { action: 'set_group', user_id: uid, group_name: g.trim() });
        if (d.status === 'ok') { toast('Группа изменена на ' + d.group_name); fetchAdmUsers(); }
      } catch (e) { toast('Сервер недоступен'); }
    }
    return;
  }
  if (a === 'ai_eco') {
    const cur = admOverviewData && admOverviewData.ai_stats && admOverviewData.ai_stats.eco_mode;
    try {
      const d = await admApi('/api/admin/ai_limit', { eco_mode: !cur });
      if (d.status === 'ok') { toast(d.eco_mode ? 'Энергосбережение включено' : 'Обычный лимит включён'); fetchAdmOverview(); }
    } catch (e) { toast('Сервер недоступен'); }
    return;
  }
  if (a === 'reset') { try { localStorage.removeItem('data'); } catch (e) {} toast('Перезагрузи страницу'); }
  else if (a === 'sim') { const v = $('adm_sim').value; if (v) { simT = v; date = ds(NOW()); $('adm').classList.remove('on'); go(); toast('Время: ' + v.replace('T', ' ')); } }
  else if (a === 'simoff') { simT = null; date = ds(NOW()); $('adm').classList.remove('on'); go(); }
  else if (a === 'pub' || a === 'unpub') {
    const text = a === 'pub' ? $('adm_ann').value.trim().slice(0, 500) : '';
    try { const d = await admApi('/api/admin/announcement', { text }); if (d.status === 'ok') { ANN = text; toast(text ? 'Опубликовано' : 'Объявление убрано'); } else toast(d.message || 'Ошибка'); } catch (e) { toast('Сервер недоступен'); }
  }
  else if (a === 'bc') {
    const text = $('adm_bc').value.trim();
    const grp = ($('adm_bc_grp') ? $('adm_bc_grp').value.trim() : '');
    if (!text) return toast('Напиши текст');
    if (!confirm(grp ? `Отправить рассылку группе ${grp}?` : 'Отправить сообщение всем пользователям бота?')) return;
    try { const d = await admApi('/api/admin/broadcast', { text, group: grp || 'all' }); toast(d.status === 'ok' ? 'Рассылка запущена, получателей: ' + d.total : (d.message || 'Ошибка')); } catch (e) { toast('Сервер недоступен'); }
  }
  else if (a === 'stats') {
    await fetchAdmOverview();
    try { const d = await admApi('/api/admin/stats'); if ($('adm_out')) $('adm_out').textContent = d.status === 'ok' ? d.lines.join('\n') : (d.message || 'Ошибка'); } catch (e) { if ($('adm_out')) $('adm_out').textContent = 'Сервер недоступен'; }
  }
  else if (a === 'upload') {
    if (!ADM_PENDING) return toast('Сначала выбери файл');
    if (!confirm('Заменить расписание у всех пользователей?')) return;
    try { const d = await admApi('/api/admin/upload_schedule', { data: ADM_PENDING }); toast(d.status === 'ok' ? 'Расписание обновлено, групп: ' + d.groups : (d.message || 'Ошибка')); } catch (e) { toast('Сервер недоступен'); }
  }
}

  today: () => { date = ds(NOW()); sched(); }, shift: v => shiftDay(+v),
  toggle_week: () => { const next = getWeek(date) === 'в' ? 'н' : 'в'; manualWeek = next === wcode(date) ? null : next; toast(manualWeek === null ? 'Неделя по календарю' : (next === 'в' ? 'Верхняя неделя вручную' : 'Нижняя неделя вручную')); go(); },
  set_ai_mode: v => { aiMode = v; ai(); },
  cal: () => { calCtx = 's'; calM = new Date(date.getFullYear(), date.getMonth(), 1); calOpen(); },
  cm: v => { calM = new Date(calM.getFullYear(), calM.getMonth()+ +v, 1); calOpen(); },
  cd: v => { const dd = new Date(calM.getFullYear(), calM.getMonth(), +v); closeS(); if (calCtx === 'h') { homeD = dd; home(); } else { date = dd; sched(); } },
  les: v => lesOpen(+v),
  savenote: async v => {
    const el = $('note');
    const val = el ? el.value.trim() : '';
    if (val) NOTES[v] = val; else delete NOTES[v];
    sv('notes', NOTES);
    if (me && me.tgUser && me.tgUser.id) {
      try {
        await fetch(`${API_URL}/api/save_note`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: me.tgUser.id, note_key: v, note_text: val })
        });
      } catch(e){}
    }
    toast('Сохранено','✓'); closeS(); ({h:home,s:sched}[tab]||(()=>{}))();
  },
  who: v => whoOpen(v),
  fav: () => {
    const k = key(PT);
    me.fav = me.fav.some(x=>key(x)===k)?me.fav.filter(x=>key(x)!==k):[...me.fav,PT];
    sv('me', me); drawWho(); if(tab==='f') flist(); if(tab==='h') home();
  },
  pd: v => { pDate = new Date(pDate.getFullYear(), pDate.getMonth(), pDate.getDate()+ +v); PSL = +v > 0 ? 1 : -1; drawWho(); },
  seg: v => { seg = v; find(); }, chg: () => pickRole(me.role, false), favs: () => { seg='f'; go('f'); },
  edit: editOpen, save: () => { const el = $('nick'); me.nick = el ? el.value.trim() : ''; me.org = 'НЧИ КФУ'; sv('me',me); closeS(); prof(); },
  look: lookOpen,
  acc: v => { cfg.ac = +v; sv('cfg', cfg); look(); lookOpen(); },
  th: v => { cfg.theme = v; sv('cfg', cfg); look(); lookOpen(); },
  shr: () => { if(navigator.share) navigator.share({title:'Расписание НЧИ КФУ',url:location.href}).catch(()=>{}); },
  reset: () => { if(confirm('Сбросить сохранённые настройки на этом устройстве?')) { localStorage.clear(); me=null; cfg={theme:'auto',ac:0}; NOTES={}; look(); go(); } },
  ver: () => { if(++taps>=5){taps=0; const p=prompt('PIN:'); if(p===ADMIN_PIN) { if (!ADM_TOKEN) ADM_TOKEN = ADMIN_PIN; adminOpen(); }} },
  x: () => {}, pick: v => { closeS(); P.cb({k:pk, n:v}); },
  auth: () => authOpen(), acode: () => authWithCode(),
  aisend: () => aiSend(), aiq: v => aiSend(v),
  aihint: () => { AICHAT.push({ me: 0, t: 'Вставь текст лекции в поле ниже и отправь. Сожму в тезисы, а потом можно переделать в вопрос-ответ или простыми словами.' }); aiRender(); const i = $('ai_input'); if (i) i.focus(); },
  airedo: v => { if (!AILEC) return toast('Сначала отправь лекцию'); AICHAT.push({ me: 1, t: 'Переделать: ' + (AISTYLES.find(x => x[0] === v) || [0, v])[1] }); aiCompress(AILEC, v); },
  aicopy: () => { if (navigator.clipboard) navigator.clipboard.writeText(AILAST).then(() => toast('Скопировано', '✓'), () => toast('Не удалось скопировать')); },
  hd: v => { const b = HB || ds(NOW()); homeD = new Date(b.getFullYear(), b.getMonth(), b.getDate() + +v); HSL = +v > 0 ? 1 : -1; home(); },
  calh: () => { calCtx = 'h'; const b = HB || ds(NOW()); calM = new Date(b.getFullYear(), b.getMonth(), 1); calOpen(); },
  shn: v => { const el = $('note'), t = el ? el.value.trim() : ''; if (!t) return toast('Сначала напиши заметку'); const msg = 'Заметка: ' + String(v).split('|')[2] + '\n' + t; if (navigator.share) navigator.share({ text: msg }).catch(() => {}); else if (navigator.clipboard) navigator.clipboard.writeText(msg).then(() => toast('Скопировано'), () => toast('Не удалось скопировать')); },
  wday: v => { const m = mon(NOW()); m.setDate(m.getDate() + +v); date = m; go('s'); },
  story: v => { const el = document.querySelector('.story[data-v="' + v + '"]'); storyOpen(v, el && el.getBoundingClientRect ? el.getBoundingClientRect() : null); },
  storyx: () => storyClose(), storynext: () => storyStep(1), storyprev: () => storyStep(-1),
  storygo: () => {
    const s = SV.list[SV.i];
    storyClose();
    setTimeout(() => {
      if (s.a === 'tg_chan') window.open(CHANNEL_URL, '_blank');
      else if (s.a === 'tab') go(s.v);
      else if (s.a === 'look') lookOpen();
    }, 200);
  },
  closeadm: () => $('adm').classList.remove('on'),
  shday_h: () => shareScheduleDay(HB || homeD || ds(NOW())),
  shday_s: () => shareScheduleDay(date || ds(NOW())),
  fbrate: v => {
    FB_RATING = +v;
    const wrap = $('fb_stars');
    if (wrap) {
      wrap.innerHTML = [1, 2, 3, 4, 5].map(n =>
        `<button type="button" data-a="fbrate" data-v="${n}" style="font-size:32px;padding:4px 8px;transform:${n <= FB_RATING ? 'scale(1.1)' : 'scale(0.95)'};opacity:${n <= FB_RATING ? '1' : '0.3'}">⭐️</button>`
      ).join('');
    }
  },
  fbsend: async () => {
    const el = $('fb_text');
    const txt = el ? el.value.trim() : '';
    const u = (me && me.tgUser) || tgU || {};
    try {
      const r = await fetch(`${API_URL}/api/feedback`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          rating: FB_RATING,
          text: txt,
          user_id: u.id || 0,
          username: u.username || '',
          first_name: dispName() || u.first_name || 'Студент',
          group_name: (me && me.target && me.target.n) || ''
        })
      });
      const d = await r.json();
      if (d && d.status === 'ok') {
        sv('feedback_sent', true);
        closeS();
        toast('Спасибо за отзыв!', '❤️');
      } else {
        toast('Не удалось отправить, попробуй позже');
      }
    } catch (e) {
      toast('Сервер недоступен');
    }
  }
};

document.addEventListener('click', e => { const c = e.target.closest('[data-a]'); if (c && A[c.dataset.a]) A[c.dataset.a](c.dataset.v); });
document.addEventListener('input', e => { if (e.target.id === 'q') items(); if (e.target.id === 'fq') flist(); });

let _sg = false;
function initSheetGestures() {
  if (_sg) return; _sg = true;
  ['pnl', 'apnl'].forEach(id => {
    const p = $(id); if (!p) return;
    let sY = 0, cY = 0, drag = false;
    p.addEventListener('touchstart', e => { if (p.scrollTop <= 0) { sY = e.touches[0].clientY; cY = sY; drag = true; } else drag = false; }, { passive: true });
    p.addEventListener('touchmove', e => { if (!drag) return; const d = e.touches[0].clientY - sY; if (d > 0) { cY = e.touches[0].clientY; p.style.transition = 'none'; p.style.transform = `translateY(${d}px)`; } }, { passive: true });
    p.addEventListener('touchend', () => {
      if (!drag) return; drag = false; p.style.transition = ''; if (cY - sY > 75) { closeS(); $('adm').classList.remove('on'); } p.style.transform = '';
    });
  });
}

function init() {
  build(); look(); initSheetGestures();
  const params = new URLSearchParams(window.location.search);
  const urlGrp = params.get('group');
  if (urlGrp && DATA[urlGrp]) me = { nick: tgU?tgU.first_name:'', org:'НЧИ КФУ', role:'g', target:{k:'g', n:urlGrp}, fav:me?.fav||[] };
  if (me && me.target && me.target.n && typeof me.target.n === 'object') { me.target = { k: me.target.k, n: me.target.n.n }; sv('me', me); }
  const okT = me && me.target && (me.target.k === 'g' ? DATA[me.target.n] : T[me.target.n]);
  if (!okT) onboard(); else go();
  checkUrlAuth();
}

// Первичный запуск и подгрузка всех групп из schedule.json
init();
fetch('./schedule.json')
  .then(r => r.ok ? r.json() : null)
  .then(j => {
    if (j && Object.keys(j).length) {
      DATA = j;
      sv('data', j);
      build();
      init();
    }
  })
  .catch(() => {});

loadAnn();
loadFeedbackStatus();
checkAdminUrl();
setTimeout(() => trackSession('open_app'), 700);

// Кнопка «Закрыть» в каждой шторке
(function () {
  const X = `<svg width="18" height="18" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
  const add = (el, act) => { if (typeof MutationObserver === 'undefined' || !el) return; new MutationObserver(() => { if (!el.querySelector(':scope > .sh-x')) el.insertAdjacentHTML('afterbegin', `<button class="sh-x" data-a="${act}" aria-label="Закрыть">${X}</button>`); }).observe(el, { childList: true }); };
  add($('pnl'), 'close'); add($('apnl'), 'closeadm');
})();

// Плавные переходы между вкладками и бегущая плашка в меню
(function () {
  const goNow = go, tabsNow = tabs, ORDER = ['h', 's', 'f', 'a', 'c']; let gid = 0;
  tabs = function () { tabsNow(); $('tabs').style.setProperty('--i', Math.max(0, ORDER.indexOf(tab))); };
  go = function (t) {
    const p = $('page'), reduce = typeof matchMedia !== 'undefined' && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!t || t === tab || !me || reduce) return goNow(t);
    const id = ++gid; tab = t; tabs(); p.classList.remove('view-enter'); p.classList.add('leave');
    setTimeout(() => { if (id !== gid) return; p.classList.remove('leave'); goNow(t); }, 130);
  };
  if (me) tabs();
})();

// Telegram WebApp: защита от закрытия свайпом и поддержка системной кнопки «Назад»
(function () {
  try {
    const W = window.Telegram && window.Telegram.WebApp; if (!W) return;
    W.ready(); W.expand();
    if (W.disableVerticalSwipes) W.disableVerticalSwipes();
    const open = () => ['sheet', 'adm', 'story'].some(id => $(id).classList.contains('on'));
    const sync = () => { if (W.BackButton) (open() ? W.BackButton.show() : W.BackButton.hide()); };
    if (W.BackButton) W.BackButton.onClick(() => { if ($('story').classList.contains('on')) storyClose(); else if ($('adm').classList.contains('on'))$('adm').classList.remove('on'); else closeS(); sync(); });
    if (typeof MutationObserver !== 'undefined') ['sheet', 'adm', 'story'].forEach(id => new MutationObserver(sync).observe($(id), { attributes: true, attributeFilter: ['class'] }));
  } catch (e) {}
})();
</script>
