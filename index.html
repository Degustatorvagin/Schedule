];

const ANCHOR = new Date(2026, 7, 31);
const $ = id => document.getElementById(id);
const ds = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const same = (a, b) => +ds(a) === +ds(b);
const wcode = d => (((Math.floor(Math.round((ds(d) - ANCHOR) / 864e5) / 7)) % 2) + 2) % 2 === 0 ? 'в' : 'н';
const mon = d => { const x = ds(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const mins = t => { const [a, b] = t.split(':'); return +a * 60 + +b; };
const hm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const dur = m => ((m >= 60 ? Math.floor(m / 60) + ' ч ' : '') + (m % 60 ? m % 60 + ' мин' : '')).trim() || '0 мин';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };

const TG = window.Telegram && window.Telegram.WebApp;

let me = ld('me');

let pk = 'g';
let taps = 0;

let calM = ds(NOW());

let aiMode = 'summary';

const key = t => t.k + ':' + t.n;

const toast = (m, ic = '') => {
  const t = $('toast');
  t.innerHTML = (ic ? `<span style="color:var(--ac);font-size:14px;">${ic}</span>` : '') + `<span>${esc(m)}</span>`;
  t.classList.add('show');
  clearTimeout(toast.i);
  toast.i = setTimeout(() => t.classList.remove('show'), 1200);
};

function look() {
  if (cfg.theme === 'auto') {
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', cfg.theme);
  }
  const a = ACC[cfg.ac || 0];
  const s = document.documentElement.style;
  s.setProperty('--ac', a[0]);
  s.setProperty('--on', a[1]);
}

function build() {
  T = {};
  for (const g in DATA) {
    const s = DATA[g].schedule || {};
    for (const w in s) {
      for (const d in s[w]) {
        for (const l of s[w][d]) {
          const n = (l.teacher || '').trim();
          if (!n || n === '—') continue;
          ((T[n] ??= {})[w] ??= {})[d] ??= [];
          T[n][w][d].push({ ...l, group: g });
        }
      }
    }
  }
}

function getWeek(d) {
  return manualWeek || wcode(d);
}

function lessonsOf(t, w, d) {
  if (!t) return [];
  if (t.k === 'g') {
    return (DATA[t.n]?.schedule?.[w]?.[d] || []).map(l => ({ ...l }));
  }
  const m = {};
  for (const l of (T[t.n]?.[w]?.[d] || [])) {
    const k = l.time + l.room + l.subject;
    if (m[k]) {
      if (!m[k].group.includes(l.group)) m[k].group += ', ' + l.group;
    } else {
      m[k] = { ...l };
    }
  }
  return Object.values(m).sort((a, b) => a.time.localeCompare(b.time));
}

const span = l => {
  const st = l.time.slice(0, 5);
  const b = BELLS[st];
  return [mins(st), b ? mins(b[0]) : mins(st) + 90];
};

const cls = t => /лек/i.test(t) ? 'lec' : /лаб/i.test(t) ? 'lab' : /пр|сем/i.test(t) ? 'pra' : 'oth';

function status(t, now) {
  const gi = now.getDay();
  const nm = now.getHours() * 60 + now.getMinutes();
  const L = gi ? lessonsOf(t, getWeek(now), DN[gi - 1]) : [];
  let live = null, next = null;
  for (const l of L) {
    const [s, e] = span(l);
    if (nm >= s && nm < e) live = { l, s, e };
    else if (s > nm && !next) next = { l, s, e };
  }
  return { live, next, L, nm };
}

const where = l => 'ауд. ' + esc(l.room) + (l.building ? ', ' + esc(l.building) : '');

function stLine(t, now) {
  const s = status(t, now);
  if (s.live) return `Сейчас: ${where(s.live.l)}`;
  if (s.next) return `Дальше: ${s.next.l.time.slice(0, 5)} ·${where(s.next.l)}`;
  return s.L.length ? 'Все пары завершены' : 'Сегодня пар нет';
}

const I = {
  h: 'M3 11l9-8 9 8v10h-6v-6H9v6H3z',

function home() {
  const now = NOW();
  const s = status(me.target, now);
  const isFinished = !s.live && !s.next && s.L.length > 0;
  const isWeekend = now.getDay() === 0 || s.L.length === 0;

  let h = `
    <div class="top">

      <div style="flex-shrink:0;">
        ${wkPill(now)}
      </div>
    </div>`;

  if (s.live) {
    const l = s.live.l;
    const durM = s.live.e - s.live.s;
    const el = s.nm - s.live.s;
    const pct = Math.max(0, Math.min(100, Math.round(el / durM * 100)));
    h += `
      <div class="box hero">
        <div class="mu">Идёт прямо сейчас · до звонка ${s.live.e - s.nm} мин</div>

        <div>${where(l)}${l.group ? '· ' + esc(l.group) : ''}</div>
        <div class="bar"><i></i></div>
      </div>`;
    setTimeout(() => {
      const b = document.querySelector('.hero .bar i');
      if (b) b.style.width = pct + '%';
    }, 20);
  } else if (s.next) {
    const l = s.next.l;
    h += `
      <div class="box hero">
        <div class="mu">Следующая пара через ${s.next.s - s.nm} мин</div>
        <h3>${esc(l.subject)}</h3>
        <div>${l.time.slice(0, 5)} · ${where(l)}${l.group ? '· ' + esc(l.group) : ''}</div>
      </div>`;
  } else if (isFinished) {
    h += `
      <div class="box g">
        <b>🎉 Все пары на сегодня завершились!</b>
        <div class="mu" style="margin-top:4px">Можно отдыхать, домашку сделаешь завтра</div>
      </div>`;
  } else {
    h += `
      <div class="box hero">
        <div class="mu">Сегодня пар нет</div>
        <h3>Выходной день 🎉</h3>
        <div>Отдыхаем и набираемся сил</div>
      </div>`;
  }

  if (isFinished || isWeekend) {
    const tomorrow = new Date(now);
    tomorrow.setDate(tomorrow.getDate() + 1);
    h += `<h2>Расписание на завтра (${tomorrow.getDate()}${MO[tomorrow.getMonth()]})</h2>`;
    h += dayHtml(me.target, tomorrow, false);
  } else {
    h += `<h2>Расписание на сегодня</h2>`;
    h += dayHtml(me.target, now, false);
  }

  if (me.fav && me.fav.length) {
    h += `<h2>Избранное</h2><div class="box g" style="padding:4px 16px">`;
    h += me.fav.map(f => item(f.k === 'g' ? 'users' : 'user', f.n, stLine(f, now), 'who', key(f))).join('');
    h += `</div>`;
  }

  $('page').innerHTML = h;
}

const dk = d => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
const nk = (d, l) => dk(d) + '|' + l.time.slice(0, 5) + '|' + l.subject;

function dayHtml(t, d, click) {
  const now = NOW();
  const w = getWeek(d);
  const gi = d.getDay();
  const L = gi === 0 ? [] : lessonsOf(t, w, DN[gi - 1]);
  const today = same(d, now);
  const nm = now.getHours() * 60 + now.getMinutes();

  if (!L.length) {
    return `<div class="empty"><b>В этот день пар нет</b>${gi === 0 ? 'Воскресенье — законный выходной' : 'Занятий по расписанию не запланировано'}</div>`;
  }

  const f = span(L[L.length - 1]);
  let h = `<div class="mu" style="margin:0 4px 12px">${L.length} ${L.length === 1 ? 'пара' : L.length < 5 ? 'пары' : 'пар'} · до ${hm(f[1])}</div>`;

  L.forEach((l, i) => {
    const [a, e] = span(l);
    if (i > 0) {
      const prev = span(L[i - 1]);
      const g = a - prev[1];
      if (g > 10) {
        const isLunch = (prev[1] === 11 * 60 + 50 && a === 12 * 60 + 30) || (prev[1] === 11 * 60 + 10 && a === 11 * 60 + 50);
        h += `<div class="gap">${isLunch ? '🥪 Обед 40 мин' : '🕳 Окно ' + dur(g)} (${hm(prev[1])} –${hm(a)})</div>`;
      }
    }
    const no = `<div class="no"><b>${i + 1}</b><span>${l.time.slice(0, 5)}</span><span>${hm(e)}</span></div>`;
    const live = today && nm >= a && nm < e;
    const note = NOTES[nk(d, l)];
    const whoSub = t.k === 't' ? (l.group || '') : (l.teacher || '');

    h += `
      <div class="row${live ? ' live' : ''}">
        ${no}
        <div>
          <button class="card g ${cls(l.type)}" ${click ? `data-a="les" data-v="${i}"` : ''}>
            <div class="tp">${esc(l.type || 'Пара')}</div>
            <h3>${esc(l.subject)}</h3>
            <div class="meta">
              <span>${esc(whoSub)}</span>
              <span class="rm">${esc(l.room)}${l.building ? ', ' + esc(l.building) : ''}</span>
            </div>
            ${note ? `<div class="nt">📝 ${esc(note)}</div>` : ''}
          </button>
        </div>
      </div>`;
  });

  return h;
}

}

// Запуск сжатия с отказоустойчивостью (Сервер Bothost + Локальный fallback)
async function runAiCompress() {
  const txt = $('lecture_text') ? $('lecture_text').value.trim() : '';
  if (!txt) return toast('Вставьте текст лекции в поле');

  const btn = $('btn_compress_ai');
  const resBox = $('ai_summary_result');
  const resContent = $('ai_summary_content');

  btn.disabled = true;
  btn.textContent = '⏳ Нейросеть сжимает материал...';
  resBox.style.display = 'none';

  let summaryResult = null;

  // 1. Попытка запроса к серверу Bothost
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 4000);
    const res = await fetch(`${API_URL}/api/ai_compress`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: txt, task: aiMode }),
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    if (res.ok) {
      const data = await res.json();
      if (data.status === 'ok') {
        summaryResult = data.result;
      }
    }
  } catch (e) {
    // Сервер оффлайн или блокировка CORS
  }

  // 2. Встроенный автономный движок (если тестируешь локально на ПК)
  if (!summaryResult) {
    const rawSentences = txt.split(/[.!?\n]+/).map(s => s.trim()).filter(s => s.length > 20);
    if (aiMode === 'summary') {
      const top = rawSentences.slice(0, 5);
      summaryResult = "📌 Ключевые тезисы материала:\n\n" + top.map((s, i) => `${i + 1}.${s}.`).join('\n\n') + "\n\n💡 Итог: материал структурирован и готов к повторению.";
    } else if (aiMode === 'cards') {
      const top = rawSentences.slice(0, 4);
      summaryResult = "❓ Экзаменационная шпаргалка:\n\n" + top.map((s, i) => `Вопрос ${i + 1}: В чём суть пункта ${i + 1}?\nОтвет: ${s}.`).join('\n\n');
    } else {
      const top = rawSentences.slice(0, 3);
      summaryResult = "💡 Объяснение простыми словами:\n\n" + top.join(' ') + "\n\n(Вся суть сводится к этим базовым положениям).";
    }
  }

  resContent.innerHTML = esc(summaryResult).replace(/\n/g, '<br>');
  resBox.style.display = 'block';
  resBox.scrollIntoView({ behavior: 'smooth' });
  toast('Готово!', '✓');

  btn.disabled = false;
  btn.textContent = '⚡ Сжать материал через ИИ';
}

function processAiQuery(q) {
  const lower = q.toLowerCase();
  const now = NOW();
  const isTeacher = me.target.k === 't';

  if (isTeacher) {
    const gi = now.getDay();
    const L = gi ? lessonsOf(me.target, getWeek(now), DN[gi - 1]) : [];
    if (lower.includes('нагруз') || lower.includes('пар') || lower.includes('расписан')) {
      if (!L.length) { postAiMsg('Сегодня занятий в расписании нет. У вас методический день.'); return; }
      postAiMsg(`📊 Ваша нагрузка на сегодня (${now.getDate()}${MO[now.getMonth()]}):\nКоличество занятий: ${L.length} (всего ${L.length * 1.5} акад. часов).\nПервая пара: ${L[0].time.slice(0, 5)} · ауд. ${L[0].room}.`);
      return;
    }
    if (lower.includes('групп')) {
      if (!L.length) { postAiMsg('Сегодня занятий нет.'); return; }
      const grps = Array.from(new Set(L.map(l => l.group))).join(', ');
      postAiMsg(`👥 Сегодня вы ведете занятия у групп: ${grps}.`);
      return;
    }
    if (lower.includes('аудитор') || lower.includes('кабинет') || lower.includes('где')) {
      if (!L.length) { postAiMsg('Сегодня аудиторий не запланировано.'); return; }
      const rms = L.map(l => `${l.time.slice(0, 5)}: ${where(l)} (${l.subject})`).join('\n');
      postAiMsg(`📍 Ваши аудитории на сегодня:\n\n${rms}`);
      return;
    }
    if (lower.includes('перерыв') || lower.includes('окно')) {
      const s = status(me.target, now);
      if (s.live) {
        postAiMsg(`⏰ До окончания текущей пары осталось ${s.live.e - s.nm} мин.`);
      } else if (s.next) {
        postAiMsg(`☕ Вы на перерыве. До начала следующей пары осталось ${s.next.s - s.nm} мин (начало в ${s.next.l.time.slice(0, 5)}).`);
      } else {
        postAiMsg('Занятий в данный момент нет.');
      }
      return;
    }
  }

  if (lower.includes('обед') || lower.includes('кушать') || lower.includes('перерыв')) {
    const nm = now.getHours() * 60 + now.getMinutes();
    const lStart = 11 * 60 + 50;
    const lEnd = 12 * 60 + 30;
    if (nm < lStart) {
      postAiMsg(`🥪 До обеда осталось ${dur(lStart - nm)} (обед с 11:50 до 12:30 в колледже и с 11:10 в институте).`);
    } else if (nm >= lStart && nm <= lEnd) {
      postAiMsg(`🥪 Сейчас обеденный перерыв! До конца обеда осталось ${lEnd - nm} мин.`);
    } else {
      postAiMsg(`🏁 Обед уже завершился.`);
    }
    return;
  }

  if (lower.includes('пар') || lower.includes('осталось') || lower.includes('скольк')) {
    const gi = now.getDay();
    if (!gi) { postAiMsg('🎉 Сегодня воскресенье, пар нет!'); return; }
    const L = lessonsOf(me.target, getWeek(now), DN[gi - 1]);
    const nm = now.getHours() * 60 + now.getMinutes();
    const remaining = L.filter(l => span(l)[1] > nm);
    if (!remaining.length) {
      postAiMsg('🎉 Все пары на сегодня уже закончились! Можно отдыхать.');
    } else {
      postAiMsg(`📚 На сегодня осталось пар: ${remaining.length}.\nБлижайшая: ${remaining[0].subject} (${where(remaining[0])}).`);
    }
    return;
  }

  if (lower.includes('отмаз') || lower.includes('опозда')) {
    const exc = EXCUSES[Math.floor(Math.random() * EXCUSES.length)];
    postAiMsg(`🎲 Вот отмазка для преподавателя:\n\n«${exc}»`);
    return;
  }

  const allT = Object.keys(T);
  const matched = allT.filter(t => lower.includes(t.toLowerCase().split(' ')[0]));
  if (matched.length) {
    const targetT = matched[0];
    const s = status({ k: 't', n: targetT }, now);
    if (s.live) {
      postAiMsg(`📍 ${targetT} прямо сейчас ведёт пару:\n📘 ${s.live.l.subject} (${s.live.l.type \vert{}\vert{} 'пара'})\n📍 ${where(s.live.l)}\n👥 Группа: ${s.live.l.group \vert{}\vert{} '—'}\n⏰ До звонка с пары осталось: ${s.live.e - s.nm} мин.`);
    } else if (s.next) {
      postAiMsg(`☕ ${targetT} сейчас на перерыве.\nСледующая пара начнётся через ${s.next.s - s.nm} мин в ${where(s.next.l)} (группа ${s.next.l.group || '—'}).`);
    } else {
      postAiMsg(`ℹ️ У преподавателя ${targetT} прямо сейчас пар нет.`);
    }
    return;
  }

  postAiMsg(`🤖 Задайте вопрос по расписанию: где преподаватель, сколько пар осталось или сколько до обеда!`);
}

  window.open(botLink, '_blank');

function initSheetGestures() {
  ['pnl', 'apnl'].forEach(id => {
    const p = $(id);
    if (!p) return;
    let sY = 0, cY = 0, drag = false;
    p.addEventListener('touchstart', e => {
      if (p.scrollTop <= 0) {
        sY = e.touches[0].clientY;
        cY = sY;
        drag = true;
      } else {
        drag = false;
      }
    }, { passive: true });

    p.addEventListener('touchmove', e => {
      if (!drag) return;
      const y = e.touches[0].clientY;
      const d = y - sY;
      if (d > 0) {
        cY = y;
        p.style.transform = `translateY(${d}px)`;
        p.style.transition = 'none';
      } else {
        p.style.transform = '';
        p.style.transition = '';
      }
    }, { passive: true });

    p.addEventListener('touchend', () => {
      if (!drag) return;
      drag = false;
      const d = cY - sY;
      p.style.transition = 'transform 0.22s cubic-bezier(0.16, 1, 0.3, 1)';
      if (d > 75) {
        p.style.transform = 'translateY(100%)';
        setTimeout(() => {
          if (id === 'pnl') closeS(); else $('adm').classList.remove('on');
          p.style.transform = '';
          p.style.transition = '';
        }, 180);
      } else {
        p.style.transform = 'translateY(0)';
        setTimeout(() => {
          p.style.transform = '';
          p.style.transition = '';
        }, 220);
      }
    });
  });
}
