*{box-sizing:border-box;margin:0;font-family:Onest,system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;transition:background-color .22s ease,border-color .22s ease,color .18s ease}
html,body{height:100%;color:var(--tx);background:var(--bg);scrollbar-width:none}
::-webkit-scrollbar{display:none}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
#page{flex:1;overflow-y:auto;padding:0 16px 120px;scrollbar-width:none}

/* Плавный переход между страницами */
.view-enter{animation:pageFade .26s cubic-bezier(0.16,1,0.3,1) forwards}
@keyframes pageFade{from{opacity:0;transform:translateY(12px) scale(0.99)}to{opacity:1;transform:translateY(0) scale(1)}}

button{border:0;background:none;color:inherit;cursor:pointer;font-size:inherit;transition:transform .12s ease,opacity .12s ease}
button:active{transform:scale(0.97)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:24px;font-weight:600;letter-spacing:0}h2{font-size:18px;font-weight:600}
.mu{color:var(--mu);font-size:13px}
.g{background:var(--sf);border:0;border-radius:24px}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 4px 10px}
.pill{font-size:13px;font-weight:600;padding:8px 14px;border-radius:99px;white-space:nowrap;display:inline-flex;align-items:center;cursor:pointer;background:var(--sf)}
.pill i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac);margin-right:7px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:700}
.box{padding:16px 18px;margin-bottom:12px}

/* Баннер главной страницы */
.main-banner{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:24px;background:linear-gradient(135deg,rgba(47,123,245,0.12),rgba(58,167,224,0.12));margin-bottom:14px}
.main-banner .owl-badge{width:54px;height:54px;border-radius:18px;background:var(--ac);display:grid;place-items:center;flex:none}
.main-banner .owl-badge img{width:70%;height:70%;filter:brightness(0) invert(1)}
.main-banner h3{font-size:18px;font-weight:700;line-height:1.2}
.main-banner p{font-size:12px;color:var(--mu);margin-top:2px}

.hero{background:var(--sf);color:var(--tx);border:0}
.hero .mu{color:var(--ac);opacity:1;font-weight:600}.hero h3{font-size:20px;font-weight:600;margin:6px 0 4px}
.hero .bar{height:6px;border-radius:6px;background:var(--ln);margin-top:14px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:var(--ac)}
.btn:not(.gl){display:block;width:100%;padding:15px;background:var(--ac);color:#fff;border-radius:26px;font-weight:600;text-align:center;text-decoration:none;margin-top:10px;font-size:15px}
.btn.gl{display:block;width:100%;padding:15px;background:var(--btn2);color:var(--tx);border-radius:26px;font-weight:600;text-align:center;text-decoration:none;margin-top:10px;font-size:15px}

.it{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 4px;border-bottom:1px solid var(--ln)}
.it:last-child{border:0}
.it b{display:block;font-weight:500;font-size:17px}
.it small{display:block;font-size:13px;color:var(--mu);margin-top:2px}
.it .t{flex:1;min-width:0}
.it .t small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{background:none;color:var(--ac);width:30px;height:30px;display:grid;place-items:center;flex:none}
.chev{color:var(--mu);flex:none;font-size:18px}
.lab2{font-size:15px;font-weight:600;color:var(--mu);margin:26px 14px 8px;letter-spacing:0}

.fld{width:100%;padding:14px 16px;border-radius:20px;background:var(--sf);border:0;color:var(--tx);font-size:15px;margin:6px 0 10px;outline:0}
textarea.fld{min-height:100px;resize:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:18px;margin:8px 0;background:var(--sf)}
.seg button{padding:10px 4px;border-radius:14px;font-weight:700;color:var(--mu);font-size:13px}
.seg .on{background:var(--ac);color:#fff}
.dots{display:flex;gap:12px;overflow-x:auto;background:var(--sf);border-radius:28px;padding:14px}
.dot{flex:none;width:46px;height:46px;border-radius:50%;color:#fff;display:grid;place-items:center}

/* Стеклянная iOS-менюшка внизу */
.tabbar{
  position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom, 0px));
  max-width:488px;margin:0 auto;display:grid;grid-template-columns:repeat(5, 1fr);
  padding:7px;border-radius:32px;z-index:10;
  background:rgba(255,255,255,0.78);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,0.4);
  box-shadow:0 12px 34px rgba(0,0,0,0.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .tabbar{
    background:rgba(28,28,30,0.8);
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 14px 38px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"] .tabbar{
  background:rgba(28,28,30,0.8);
  border:1px solid rgba(255,255,255,0.1);
  box-shadow:0 14px 38px rgba(0,0,0,0.4);
}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mu);padding:8px 2px;border-radius:20px}
.tabbar .on{background:var(--bg);color:var(--ac)}

.day-nav-bar{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px}
.day-nav-bar b{font-size:15px;font-weight:600}
.day-nav-btn{font-size:13px;font-weight:700;padding:7px 14px;border-radius:99px;background:var(--sf)}

/* Полоска дней и выходные дни для учителей */
.strip{display:grid;grid-template-columns:repeat(7, 1fr);gap:4px;padding:0;margin-bottom:14px;border-radius:0}
.d{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;border-radius:18px}
.d span{font-size:11px;color:var(--mu);font-weight:600}
.d b{font-size:17px;font-weight:800}
.d u{width:5px;height:5px;border-radius:50%;background:var(--ln)}
.d.has u{background:var(--mu)}
.d.now:not(.sel) b{color:var(--ac)}
.d.sel{background:var(--ac);color:#fff}
.d.sel span,.d.sel b{color:#fff}.d.sel u{background:#fff}
.d.teacher-off{background:color-mix(in srgb,var(--free) 14%,transparent);border:1px dashed var(--free)}
.d.teacher-off span{color:var(--free)}

.cr{display:block;width:100%;text-align:left;padding:14px 20px;border-bottom:1px solid var(--ln)}
.cr:last-child{border:0}
.cr-t{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mu);font-weight:600}
.cr-t .tm{margin-left:auto;font-variant-numeric:tabular-nums}
.nb{margin-left:-20px;padding:0 12px 0 20px;height:26px;border-radius:0 13px 13px 0;background:var(--ln);color:var(--tx);font-weight:700;display:inline-grid;place-items:center}
.nb.on{background:var(--cur);color:#04202c}
.cr-n{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:17px;font-weight:600;margin-top:6px}
.cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr-r{font-size:14px;color:var(--mu);margin-top:3px}
.gap{margin:0 0 12px 20px;padding:8px 14px;border:1px dashed var(--ln);border-radius:18px;font-size:12px;color:var(--mu)}
.empty{text-align:center;padding:46px 20px;color:var(--mu)}
.empty b{display:block;font-size:18px;color:var(--tx);margin-bottom:6px}

/* Шторки модалок с кнопкой ✕ */
.sheet{position:fixed;inset:0;display:none;z-index:99}
.sheet.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(3px)}
.panel{
  position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;
  max-height:88%;min-height:40%;background:var(--bg);border-radius:32px 32px 0 0;
  display:flex;flex-direction:column;padding:12px 18px calc(18px + env(safe-area-inset-bottom, 0px));
  overflow-y:auto;scrollbar-width:none;touch-action:pan-y;
  animation:sheetSlideUp .26s cubic-bezier(0.16,1,0.3,1) forwards;
}
@keyframes sheetSlideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.panel-h-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex:none}
.close-btn{width:36px;height:36px;border-radius:50%;background:var(--sf);display:grid;place-items:center;font-size:16px;font-weight:700;color:var(--mu)}

/* Экран блокировки Совёнка AI с парящими лентами */
.ai-locked-box{position:relative;min-height:68vh;display:flex;align-items:center;justify-content:center;border-radius:28px;overflow:hidden;padding:26px 14px}
.ai-flow-bg{position:absolute;inset:-30px;display:flex;flex-direction:column;gap:12px;opacity:0.16;pointer-events:none;transform:rotate(-7deg) scale(1.08);user-select:none}
.f-line{display:flex;gap:10px;white-space:nowrap;animation:fLoop 28s linear infinite}
.f-line:nth-child(even){animation-direction:reverse;animation-duration:34s}
@keyframes fLoop{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.f-pill{padding:9px 18px;border-radius:99px;background:var(--tx);color:var(--bg);font-weight:700;font-size:14px}
.ai-lock-card{position:relative;z-index:2;text-align:center;max-width:340px;padding:22px 16px}
.ai-lock-badge{width:62px;height:62px;border-radius:50%;margin:0 auto 14px;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:26px}

.kfu-avatar-wrap{width:88px;height:88px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;overflow:hidden;padding:6px}
.kfu-avatar-wrap img{width:86%;height:86%;object-fit:contain}
.bub{padding:12px 16px;border-radius:20px;margin-bottom:10px;max-width:90%;font-size:14px;line-height:1.4}
.bub.g{background:var(--sf)}.bub.me{margin-left:auto;background:var(--ac);color:#fff;font-weight:500}

.qc{background:var(--sf);font-weight:500;padding:8px 13px;border-radius:14px;font-size:13px;cursor:pointer}
.composer{display:flex;gap:8px;align-items:flex-end;margin-top:6px}
.composer textarea{flex:1;min-height:50px;max-height:130px;resize:none;padding:14px 16px;border-radius:20px;background:var(--sf);border:0;color:var(--tx);outline:0}

const wcode = d => (((Math.floor(Math.round((ds(d) - ANCHOR) / 864e5) / 7)) % 2) + 2) % 2 === 0 ? 'в' : 'н';
const mon = d => { const x = ds(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const mins = t => { const [a, b] = t.split(':'); return +a * 60 + +b; };
const hm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const dur = m => ((m >= 60 ? Math.floor(m / 60) + ' ч ' : '') + (m % 60 ? m % 60 + ' мин' : '')).trim() || '0 мин';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function look() {

  else document.documentElement.setAttribute('data-theme', cfg.theme);
  const a = ACC[cfg.ac || 0], s = document.documentElement.style;
  s.setProperty('--ac', a[0]); s.setProperty('--on', a[1]); s.setProperty('--acg', a[0]);
}

function build() {
  T = {};
  for (const g in DATA) {
    const s = DATA[g].schedule || {};
    for (const w in s) {
      for (const d in s[w]) {
        for (const l of s[w][d]) {
          const n = (l.teacher || '').trim();
          if (!n || n === '—') continue;
          ((T[n] ??= {})[w] ??= {})[d] ??= [];
          T[n][w][d].push({ ...l, group: g });
        }
      }
    }
  }
}

function getWeek(d) { return manualWeek || wcode(d); }

function lessonsOf(t, w, d) {
  if (!t) return [];
  if (t.k === 'g') return (DATA[t.n]?.schedule?.[w]?.[d] || []).map(l => ({ ...l }));
  const m = {};
  for (const l of (T[t.n]?.[w]?.[d] || [])) {
    const k = l.time + l.room + l.subject;
    if (m[k]) { if (!m[k].group.includes(l.group)) m[k].group += ', ' + l.group; }
    else m[k] = { ...l };
  }
  return Object.values(m).sort((a, b) => a.time.localeCompare(b.time));
}

const span = l => { const st = l.time.slice(0, 5), b = BELLS[st]; return [mins(st), b ? mins(b[0]) : mins(st) + 90]; };
const cls = t => /лек/i.test(t) ? 'lec' : /лаб/i.test(t) ? 'lab' : /пр|сем/i.test(t) ? 'pra' : 'oth';

function status(t, now) {
  const gi = now.getDay(), nm = now.getHours() * 60 + now.getMinutes();
  const L = gi ? lessonsOf(t, getWeek(now), DN[gi - 1]) : [];
  let live = null, next = null;
  for (const l of L) {
    const [s, e] = span(l);
    if (nm >= s && nm < e) live = { l, s, e };
    else if (s > nm && !next) next = { l, s, e };
  }
  return { live, next, L, nm };
}

const where = l => 'ауд. ' + esc(l.room) + (l.building ? ', ' + esc(l.building) : '');

function stLine(t, now) {
  const s = status(t, now);
  if (s.live) return `Сейчас: ${where(s.live.l)}`;
  if (s.next) return `Дальше: ${s.next.l.time.slice(0, 5)} · ${where(s.next.l)}`;
  return s.L.length ? 'Все пары завершены' : 'Сегодня пар нет';
}

const dk = d => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
const nk = (d, l) => dk(d) + '|' + l.time.slice(0, 5) + '|' + l.subject;

function dayHtml(t, d, click) {
  const now = NOW(), w = getWeek(d), gi = d.getDay();
  const L = gi === 0 ? [] : lessonsOf(t, w, DN[gi - 1]);
  const today = same(d, now), nm = now.getHours() * 60 + now.getMinutes();
  const isTeacher = t.k === 't';

  if (!L.length) {
    return `<div class="empty"><b>В этот день пар нет</b>${isTeacher ? '🌴 У вас свободный от занятий день' : 'Занятий по расписанию не запланировано'}</div>`;
  }

  let h = `<div class="cmp g">`;
  h += `<div class="cmp-h"><span>${L.length} пар</span><span>до ${hm(span(L[L.length - 1])[1])}</span></div>`;

  L.forEach((l, i) => {
    const [a, e] = span(l);
    if (i > 0) {
      const prev = span(L[i - 1]), g = a - prev[1];
      if (g > 10) h += `<div class="gap">🕳 Окно ${dur(g)} (${hm(prev[1])} – ${hm(a)})</div>`;
    }
    const live = today && nm >= a && nm < e;
    const note = NOTES[nk(d, l)];
    h += `
      <button class="cr" ${click ? `data-a="les" data-v="${i}"` : ''}>
        <div class="cr-t">
          <span class="nb${live ? ' on' : ''}">${i + 1}</span>
          <span>${esc(l.type || 'Пара')}</span>
          <span class="tm">${l.time.slice(0, 5)} — ${hm(e)}</span>
        </div>
        <div class="cr-n">
          <span class="cn">${esc(l.subject)}</span>
          ${note ? '<span class="mu">📝</span>' : ''}
        </div>
        <div class="cr-r">
          <span>${esc(isTeacher ? (l.group || '') : (l.teacher || ''))}</span>
          <span> · ${where(l)}</span>
        </div>
      </button>`;
  });
  h += `</div>`;
  return h;
}

function sched() {

  const isTeacher = t.k === 't';

      <b>${date.getDate()} ${MO[date.getMonth()]}</b>
      <button class="day-nav-btn g" data-a="shift" data-v="1">▶</button>
    </div>`;

  const m = mon(date), w = getWeek(date);
  let s = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(m); d.setDate(m.getDate() + i);
    const dayLessons = (i < 6) ? lessonsOf(t, w, DN[i]).length : 0;
    const isFree = isTeacher && (dayLessons === 0);
    s += `<button class="d${dayLessons ? ' has' : ''}${same(d, now) ? ' now' : ''}${same(d, date) ? ' sel' : ''}${isFree ? ' teacher-off' : ''}" data-a="day" data-v="${i}">
      <span>${SH[i]}</span>
      <b>${d.getDate()}</b>
      <u></u>
    </button>`;
  }
  h += `<div class="strip">${s}</div>`;
  CUR = gi === 0 ? [] : lessonsOf(t, w, DN[gi - 1]);
  h += `<div id="lst" class="view-enter">${dayHtml(t, date, true)}</div>`;
  $('page').innerHTML = h;
  $('today').hidden = same(date, now);
}

          <div class="ai-lock-badge">🔒</div>
          <h3 style="font-size:19px;font-weight:700;margin-bottom:6px;">Войди в аккаунт — и Совёнок AI станет твоим личным помощником</h3>
          <p class="mu" style="font-size:13px;line-height:1.4;margin-bottom:16px;">Синхронизируй расписание и сжимай лекции в тезисы для тетради</p>
          <button class="btn" onclick="openAuthSheet()">Войти в аккаунт</button>
        </div>
      </div>`;
    return;
  }

  $('page').innerHTML = `
    <div class="top">
      <div><h1>Совёнок AI</h1><div class="mu">Учебный помощник НЧИ КФУ</div></div>
      <div class="ib g" style="width:40px;height:40px;font-size:20px;">🦉</div>
    </div>
    <div class="box g" style="padding:16px;">
      <b style="font-size:16px;display:block;margin-bottom:4px;">📝 Сжать лекцию для тетради</b>
      <div class="mu" style="margin-bottom:10px;">Вставь материал — Совёнок сделает конспект на 2-3 страницы без лишней воды</div>
      <div class="seg">
        <button class="${aiMode==='summary'?'on':''}" data-a="set_ai_mode" data-v="summary">📌 Тезисы</button>
        <button class="${aiMode==='cards'?'on':''}" data-a="set_ai_mode" data-v="cards">❓ Вопрос-Ответ</button>
        <button class="${aiMode==='simple'?'on':''}" data-a="set_ai_mode" data-v="simple">💡 Просто</button>
      </div>
      <textarea class="fld" id="lecture_text" style="min-height:110px;" placeholder="Вставь сюда текст лекции..."></textarea>
      <button class="btn" id="btn_compress_ai" onclick="runAiCompress()">🦉 Сократить через Совёнок AI</button>
      <div id="ai_summary_result" class="box g" style="display:none;margin-top:14px;background:var(--bg);padding:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <b style="color:var(--ac);">Конспект от Совёнка:</b>
          <button class="pill" onclick="copyAiResult()" style="font-size:11px;padding:4px 10px;">Копировать</button>
        </div>
        <div id="ai_summary_content" style="font-size:14px;line-height:1.5;white-space:pre-wrap;"></div>
      </div>
    </div>
    <div class="lab2">Вопрос по учёбе</div>
    <div id="ai_chat" style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px"><div class="bub g">🦉 Привет! Я Совёнок AI. Спроси про тему, задачу или отправь лекцию для конспекта!</div></div>
    <div class="composer">
      <textarea id="ai_input" placeholder="Спроси по учёбе..."></textarea>
      <button class="ib g" id="ai_send" style="background:var(--ac);color:#fff;width:48px;height:48px;border-radius:20px;flex:none">${ico('up',20)}</button>
    </div>`;

  $('ai_send').onclick = handleAiSend;
  $('ai_input').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleAiSend(); } };
}

async function runAiCompress() {
  const el = $('lecture_text'), txt = el ? el.value.trim() : '';
  if (!txt) return toast('Вставьте текст лекции');
  const btn = $('btn_compress_ai'), resBox = $('ai_summary_result'), resContent =$('ai_summary_content');
  btn.disabled = true; btn.textContent = '🦉 Совёнок думает...'; resBox.style.display = 'none';
  try {
    const res = await fetch(`${API_URL}/api/ai_compress`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: txt, task: aiMode, user_id: (me?.tgUser?.id || '') })
    });
    const data = await res.json();
    if (data.status === 'ok') {
      resContent.innerHTML = esc(data.result).replace(/\n/g, '<br>');
      resBox.style.display = 'block'; toast('Готово!', '✓');
    } else toast(data.message || 'Ошибка');
  } catch (e) { toast('Сервер недоступен'); }
  finally { btn.disabled = false; btn.textContent = '🦉 Сократить через Совёнок AI'; }
}

function copyAiResult() {
  const t = $('ai_summary_content').innerText;
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast('Скопировано', '✓'));
}

function handleAiSend() {
  const inp = $('ai_input'), q = inp.value.trim();
  if (!q) return;
  const c = $('ai_chat');
  c.innerHTML += `<div class="bub me">${esc(q)}</div>`;
  inp.value = '';
  c.scrollTop = c.scrollHeight;
  fetch(`${API_URL}/api/ai_chat`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question: q, user_id: (me?.tgUser?.id || '') })
  }).then(r => r.json()).then(data => {
    c.innerHTML += `<div class="bub g">${esc(data.result || 'Сбой ответа')}</div>`;
    c.scrollTop = c.scrollHeight;
  }).catch(() => {
    c.innerHTML += `<div class="bub g">🦉 Сервер сейчас недоступен. Попробуй позже.</div>`;
  });
}

// Экран профиля

      ${item('pal', 'Цветовая палитра', 'Тема и цвет акцента', 'look')}

    <div class="box g" style="padding:4px 16px">
      <a class="it" href="https://t.me/AvaUtility_support" target="_blank" style="color:inherit;text-decoration:none"><span class="ic">${ico('tg')}</span><span class="t"><b>Поддержка КФУ</b><small>@AvaUtility_support</small></span><span class="chev">›</span></a>

}

function lookOpen() {
  $('pnl').innerHTML = `
    <div class="panel-h-row"><h1 style="font-size:20px">Оформление</h1><button class="close-btn" data-a="close">✕</button></div>

function editOpen() {
  $('pnl').innerHTML = `
    <div class="panel-h-row"><h1 style="font-size:20px">Имя в профиле</h1><button class="close-btn" data-a="close">✕</button></div>
    <input class="fld" id="nick" value="${esc((me&&me.nick)||'')}" placeholder="Например: Руслан">

}

function onboard() {
  $('tabs').hidden = true;
  $('page').innerHTML = `
    <div style="padding-top:10vh;">
      <h1>Расписание</h1>
      <p class="mu" style="margin:6px 0 24px;">Выберите роль:</p>
      <button class="box g" data-a="role" data-v="g" style="display:block;width:100%;text-align:left;margin-bottom:12px;"><b>🎓 Студент</b><small class="mu" style="display:block;margin-top:4px;">Выбрать группу</small></button>
      <button class="box g" data-a="role" data-v="t" style="display:block;width:100%;text-align:left;"><b>👨‍🏫 Преподаватель</b><small class="mu" style="display:block;margin-top:4px;">По пин-коду</small></button>
    </div>`;
}

function picker(o) {
  P = o; pk = o.k;
  $('pnl').innerHTML = `
    <div class="panel-h-row"><h1 style="font-size:20px">${o.title}</h1><button class="close-btn" data-a="close">✕</button></div>
    <input class="fld" id="q" placeholder="Поиск..." autocomplete="off"><div id="items"></div>`;
  $('sheet').classList.add('on'); items();
}

function items() {
  const n = s => s.toLowerCase().replace(/[^a-z0-9а-яё]/g,''), q = n($('q').value);
  const ls = pk === 'g' ? Object.keys(DATA) : Object.keys(T).sort((a,b)=>a.localeCompare(b,'ru'));
  $('items').innerHTML = ls.filter(k=>!q||n(k).includes(q)||(pk==='g'&&n(DATA[k].spec||'').includes(q))).map(k=>item(pk==='g'?'users':'c',esc(k),pk==='g'?esc((DATA[k].spec||'').replace(/,\s*\d+\s*чел.*/,'')):'Преподаватель','pick',k)).join('')||'<div class="empty"><b>Ничего не найдено</b></div>';
}

const pickRole = (r, lock) => {
  if (r === 't') {
    const pin = prompt('Пин-код преподавателя:');
    if (pin !== TEACHER_PIN) return toast('Неверный код','✕');
  }
  picker({
    k: r, lock, title: r==='g'?'Твоя группа':'Твоя фамилия',
    cb: t => {
      me = me || { org: 'НЧИ КФУ', fav: [] };
      me.role = r; me.target = { k: r, n: t };
      sv('me', me); go('h');
    }
  });
};

const closeS = () => $('sheet').classList.remove('on');

let authPollTimer = null;
let currentAuthCode = null;

function openAuthSheet() {
  currentAuthCode = Math.random().toString(36).substring(2, 8).toUpperCase();
  const botLink = `https://t.me/${BOT}?start=auth_${currentAuthCode}`;

  $('pnl').innerHTML = `
    <div class="panel-h-row"><h1 style="font-size:20px">Вход через Telegram</h1><button class="close-btn" data-a="close">✕</button></div>
    <div class="mu" style="line-height:1.4;margin-bottom:14px">Подтвердите вход в боте или введите код из команды <code>/login</code>:</div>
    <a href="${botLink}" target="_blank" rel="noopener" class="btn" onclick="startPollingAuth('${currentAuthCode}')" style="margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;">
      <span>${ico('tg', 18)}</span><span>Открыть бота в Telegram</span>
    </a>
    <div class="lab2">Или введите 6-значный код:</div>
    <div style="display:flex;gap:8px;">
      <input class="fld" id="manual_code" style="text-transform:uppercase;font-weight:700;letter-spacing:2px;text-align:center;margin:0;" placeholder="A1B2C3" maxlength="6">
      <button class="btn" style="width:auto;margin:0;padding:0 20px;" onclick="verifyManualCode()">Войти</button>
    </div>`;
  $('sheet').classList.add('on');
  startPollingAuth(currentAuthCode);
}

function startPollingAuth(authCode) {
  toast('Ожидаем подтверждения...', '💬');
  clearInterval(authPollTimer);
  authPollTimer = setInterval(async () => {
    try {
      const res = await fetch(`${API_URL}/api/auth_poll?code=${authCode}`);
      if (!res.ok) return;
      const data = await res.json();
      if (data.status === 'confirmed') {
        clearInterval(authPollTimer);
        applyAuth(data);
      }
    } catch(e){}
  }, 2000);
}

function verifyManualCode() {
  const el = $('manual_code'), code = el ? el.value.trim().toUpperCase() : '';
  if (!code || code.length < 4) return toast('Введите код');
  toast('Проверяем...', '⏳');
  fetch(`${API_URL}/api/auth_poll?code=${code}`)
    .then(r => r.json())
    .then(data => {
      if (data.status === 'confirmed') {
        clearInterval(authPollTimer);
        applyAuth(data);
      } else toast('Код не найден или истёк', '✕');
    }).catch(() => toast('Сервер недоступен', '✕'));
}

function applyAuth(data) {
  me = me || { org: 'НЧИ КФУ', fav: [] };
  me.tgUser = { id: data.user_id, username: data.username, first_name: data.first_name };
  if (data.target && DATA[data.target]) me.target = { k: 'g', n: data.target };
  sv('me', me);
  closeS();
  toast(`Вход: ${data.first_name}`, '✓');
  go(tab === 'a' ? 'a' : 'c');
}

function checkUrlAuth() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('auth_code');
  if (code) {
    fetch(`${API_URL}/api/auth_poll?code=${code}`)
      .then(r => r.json())
      .then(data => { if (data.status === 'confirmed') applyAuth(data); })
      .catch(() => {});
  }
}

const A = {
  tab: v => go(v), role: v => pickRole(v, true), close: () => closeS(),
  day: v => { const m = mon(date); m.setDate(m.getDate() + +v); date = m; sched(); },
  today: () => { date = ds(NOW()); sched(); }, shift: v => shiftDay(+v),
  toggle_week: () => {
    manualWeek = (getWeek(date) === 'в') ? 'н' : 'в';
    toast(manualWeek === 'в' ? 'Верхняя неделя 🔼' : 'Нижняя неделя 🔽');
    go();
  },
  owl_badge: () => toast('НЧИ КФУ · Совёнок AI', '🦉'),
  set_ai_mode: v => { aiMode = v; ai(); },
  cal: () => { calM = new Date(date.getFullYear(), date.getMonth(), 1); calOpen(); },
  cd: v => { date = new Date(calM.getFullYear(), calM.getMonth(), +v); closeS(); sched(); },
  les: v => lesOpen(+v),
  savenote: async v => {
    const el = $('note'), val = el ? el.value.trim() : '';
    if (val) NOTES[v] = val; else delete NOTES[v];
    sv('notes', NOTES);
    if (me && me.tgUser && me.tgUser.id) {
      try {
        await fetch(`${API_URL}/api/save_note`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: me.tgUser.id, note_key: v, note_text: val })
        });
      } catch(e){}
    }
    toast('Сохранено','✓'); closeS(); sched();
  },
  who: v => whoOpen(v),
  fav: () => {
    const k = key(PT);
    me.fav = me.fav.some(x=>key(x)===k)?me.fav.filter(x=>key(x)!==k):[...me.fav,PT];
    sv('me', me); drawWho(); if(tab==='f') flist(); if(tab==='h') home();
  },
  pd: v => { pDate = new Date(pDate.getFullYear(), pDate.getMonth(), pDate.getDate()+ +v); drawWho(); },
  seg: v => { seg = v; find(); }, chg: () => pickRole(me.role, false), favs: () => { seg='f'; go('f'); },
  edit: editOpen, save: () => { const el = $('nick'); me.nick = el ? el.value.trim() : ''; me.org = 'НЧИ КФУ'; sv('me',me); closeS(); prof(); },
  look: lookOpen,
  acc: v => { cfg.ac = +v; sv('cfg', cfg); look(); lookOpen(); },
  th: v => { cfg.theme = v; sv('cfg', cfg); look(); lookOpen(); },
  shr: () => { if(navigator.share) navigator.share({title:'Расписание НЧИ КФУ',url:location.href}).catch(()=>{}); },
  reset: () => { if(confirm('Сбросить сохранённые настройки на этом устройстве?')) { localStorage.clear(); me=null; cfg={theme:'auto',ac:0}; NOTES={}; look(); go(); } },
  ver: () => { if(++taps>=5){taps=0; const p=prompt('PIN:'); if(p===ADMIN_PIN||p==='KEY') adminOpen();} },
  x: () => {}, pick: v => { closeS(); P.cb({k:pk, n:v}); }
};

document.addEventListener('click', e => { const c = e.target.closest('[data-a]'); if (c && A[c.dataset.a]) A[c.dataset.a](c.dataset.v); });
document.addEventListener('input', e => { if (e.target.id === 'q') items(); if (e.target.id === 'fq') flist(); });

function adminOpen() {
  fetch(`${API_URL}/api/admin/stats?token=${ADMIN_PIN}`)
    .then(r => r.json())
    .then(data => {
      const stats = (data.lines || []).map(l => `<div>• ${esc(l)}</div>`).join('') || '<div>Статистика недоступна</div>';
      $('apnl').innerHTML = `
        <div class="panel-h-row"><h1 style="font-size:20px">Админ-панель</h1><button class="close-btn" data-a="close">✕</button></div>
        <div class="box g" style="margin-bottom:12px;line-height:1.5;">${stats}</div>`;
      $('adm').classList.add('on');
    })
    .catch(() => {
      $('apnl').innerHTML = `
        <div class="panel-h-row"><h1 style="font-size:20px">Админ-панель</h1><button class="close-btn" data-a="close">✕</button></div>
        <div class="box g">Сервер Bothost сейчас недоступен.</div>`;
      $('adm').classList.add('on');
    });
  $('ascrim').onclick = () =>$('adm').classList.remove('on');
}

function init() {
  build(); look();
  const params = new URLSearchParams(window.location.search);
  const urlGrp = params.get('group');
  if (urlGrp && DATA[urlGrp]) me = { nick: tgU?tgU.first_name:'', org:'НЧИ КФУ', role:'g', target:{k:'g', n:urlGrp}, fav:me?.fav||[] };
  if (!me) onboard(); else go();
  checkUrlAuth();
}

init();
fetch('./schedule.json')
  .then(r => r.ok ? r.json() : null)
  .then(j => {
    if (j && Object.keys(j).length) {
      DATA = j;
      build();
      init();
    }
  })
  .catch(() => {});
</script>
